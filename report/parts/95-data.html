var DATA = {"meta":{"sources":560,"failures":43,"generated":"2026-08-27"},"cats":[{"key":"cn-mega","en":"Mega-agency","zh":"传统大所"},{"key":"cn-premium","en":"Premium boutique (CN)","zh":"高端申请机构"},{"key":"cn-platform","en":"Platform / half-DIY","zh":"平台与半DIY"},{"key":"cn-background","en":"Background & academic","zh":"背景提升与学术"},{"key":"cn-community","en":"Community & media","zh":"社区与内容"},{"key":"cn-ukhk","en":"UK/HK/SG specialist","zh":"英港新专门机构"},{"key":"gl-platforms","en":"Global recruiter platform","zh":"国际招生平台"},{"key":"gl-pathway","en":"Pathway & B2B enrolment","zh":"预科与B2B"},{"key":"gl-premium","en":"Western premium","zh":"欧美高端咨询"},{"key":"gl-mba","en":"MBA & specialist","zh":"MBA与专项硕士"},{"key":"gl-region","en":"Regional & infrastructure","zh":"区域与基础设施"},{"key":"failed","en":"Failure case","zh":"失败案例"}],"companies":[{"name_en":"Aoji Education (Ambright)","name_zh":"澳际教育","country":"China","founded":"1990 (claims Sydney origin; Beijing HQ), founder Li Ping 李平","status":"active but faded from first tier; sister immigration arm hit by refund scandals; subsidiaries with compliance blacklistings","ownership":"Private, founder-controlled (Li Ping); never listed","funding":"No disclosed external funding","team_size":"Claims 33 branches + 7 overseas offices, '700+ returnee consultants, 1,500+ mentors'; Beijing entity social-insurance headcount only 359 — realistic est. 400-900 actual staff. Basis: baike claims vs 社保 filings","target_dest":"AUS-first (historic #1 China market share, tier-1 agent for 39 accredited AU universities), plus UK/US/CA/NZ/EU/Asia","segment":"Full funnel (少儿英语 to 移民); Masters significant via Australia/UK volume, but brand is destination-led (AUS) rather than degree-led","pricing":"AUS often low/zero-fee (commission-funded); other destinations RMB 20k-60k packages (est., low confidence)","business_model":"University-agent model at its purest: deep AU university tier-1 agencies mean commission income funds cheap consulting; plus English training, prep school, study tours, immigration, overseas property","marketing_channels":"Baidu SEM, 教育展, WeChat 公众号, branch 小红书/抖音 accounts, legacy TV/portal advertising; '澳际' brand equity in Australia niche","marketing_notes":"2025-26: aging institutional brand living off its Australia association just as AU tightens visas; digital presence undistinguished; no founder IP (Li Ping is honored-figure profile, not content creator). No verifiable follower counts via search. Vulnerable to 小红书-native AU boutiques (e.g. UNILINK-style) eating its exact niche","marketing_budget_est":"est. RMB 30-80M/yr (low confidence): mid-size SEM + expo spend, far below JJL/EIC","revenue_est":"No public data; est. RMB 3-8亿/yr (low confidence)","valuation":"Unknown","investors":"None disclosed","positioning_en":"The Australia specialist that scaled into a generic old-brand agency: first mover on AUS (first agency to partner with the Australian embassy), now trading on 35 years of heritage more than current capability.","positioning_zh":"从澳洲专家做成\"万金油\"老牌机构：澳洲留学的开创者（第一家与澳使馆合作的中介），如今更多是在吃35年品牌老本，而非当下的服务能力。","problems_en":"澳际移民 (immigration arm) publicly accused of 'irregular operations, slow and difficult refunds' with EIC-style contract traps (Jiemian 2021), dragging the education brand down; Luoyang subsidiary repeatedly on the operating-anomaly list 2021-2025 and placed on the serious-violation blacklist in 2023 — governance sloppiness across the franchise-like branch network; claimed headcounts (700+ consultants) wildly exceed insured staff (359), suggesting inflated marketing claims; Australia visa tightening hits its core commission engine.","problems_zh":"澳际移民被公开报道\"违规操作、退费慢退费难\"（界面2021），拖累教育主品牌；洛阳子公司2021-2025连年被列经营异常、2023年被列入严重违法企业名单——类加盟分公司网络治理粗放；宣传的\"700+海归顾问\"与359人的社保参保数严重不符，规模注水；澳洲签证收紧直接冲击其返佣核心引擎。","lessons_en":"Copy: the original single-destination authority play — being 'the Australia firm' built a 30-year moat; a boutique should own a destination/segment identity that specific. Avoid: brand dilution into six product lines run at franchise quality; never let claimed headcount/credentials diverge from verifiable reality — corporate registry data is public and clients check.","lessons_zh":"可借鉴：最经典的\"单一目的地权威\"打法——\"澳洲=澳际\"构筑了30年护城河，精品机构应占领同样精确的目的地/学段心智。需避免：品牌稀释成六大产品线却只有加盟店质量；宣传规模与工商/社保等可查数据脱节——这些信息是公开的，客户会查。","confidence":"medium","sources":"https://www.jiemian.com/article/5812424.html, https://baike.baidu.com/item/澳际教育集团/804926, https://baike.baidu.com/item/洛阳澳际教育咨询有限公司, http://10.ip138.com/liuxuezhongjiejigou/aoji/, https://www.zhihu.com/question/40457011","category_key":"cn-mega","_founded":1990,"_team":650,"_fund":null,"_cn":true},{"name_en":"Bailitop Education","name_zh":"百利天下","country":"China","founded":"2004 (Beijing)","status":"active — Beijing-centric mid-large shop, US-grad + Japan focus","ownership":"Private (百利天下教育集团); not listed; founder-run","funding":"No disclosed external funding","team_size":"~1,000 staff (company claim; two Beijing office sites, 12,000+ sqm — 中国电子大厦 + 中关村SOHO). Basis: company materials/qianmu","target_dest":"US-first (esp. graduate school), strong Japan line; also UK/CA/AUS/HK","segment":"Masters-first in practice: US graduate applications are the historical core product, wrapped in its '规划式' (planning-style) service system; also UG and Japan","pricing":"~RMB 40k-70k typical US grad packages (a documented complaint cites RMB 60k); Japan lines cheaper (est., medium confidence)","business_model":"Centralized Beijing back-office 'assembly line': big telemarketing/SEM front end feeding a large in-house planning + essay team; no big branch network — phone/online national sales instead","marketing_channels":"Historically one of the heaviest Baidu SEM spenders in the category; telemarketing follow-up machine; WeChat 公众号 content; 知乎; now 小红书/抖音 accounts and B站 lecture content","marketing_notes":"2025-26: institutional brand, no founder IP. Its model is the purest 'paid-traffic + phone sales' operation among the majors — effective at volume, but produces the classic complaint arc (great pre-sales attention, decaying post-sales service). 一亩三分地 hosts a detailed 2025-era 'avoid Bailitop' thread (RMB 60k, poor service, dragged refund) — meaning its reputation problem now lives on the exact forums US-grad applicants read. No verifiable follower counts via search","marketing_budget_est":"est. RMB 30-80M/yr (low confidence): sustained SEM dominance requires eight figures annually; ~1,000 staff includes large sales floor","revenue_est":"No public data; est. RMB 2-5亿/yr (low confidence, from headcount and package pricing)","valuation":"Unknown","investors":"None disclosed","positioning_en":"The centralized US-grad application factory: no branch sprawl, one big Beijing operation buying national traffic and converting by phone — 'planning-style' service language over an industrialized delivery line.","positioning_zh":"中心化的美研申请工厂：不铺分公司，北京一个大本营买全国流量、电话转化——用\"规划式服务\"话术包装工业化交付流水线。","problems_en":"Documented complaint pattern: RMB 60k packages with terrible delivery and refunds dragged indefinitely (1point3acres); teachers can't attend to each student, generic essays, uneven staff ability, frequent teacher swaps (Zhihu); pre-sales enthusiasm vs post-sales decay is its most repeated review; US-grad concentration exposed to US policy chill; phone-sales model increasingly hated by the 小红书 generation who screen calls.","problems_zh":"投诉画像清晰：6万套餐服务体验极差、退款无限拖延（一亩三分地）；老师顾不过来每个学生、文书平庸、员工水平参差、频繁换老师（知乎）；\"签约前热情、签约后失联\"是最高频评价；美研集中度受美国政策寒意冲击；电销模式被小红书一代深恶痛绝（直接挂电话）。","lessons_en":"Copy: its insight that Masters applicants can be served nationally without physical branches — a boutique can absolutely run remote-first with lower fixed costs. Avoid: everything else — paid-traffic + phone-sales acquisition poisons premium positioning; capacity overselling (more clients than senior staff can serve) is the root of its complaint record; never let the 1point3acres/Zhihu record accumulate unanswered, because US/UK grad applicants read exactly those threads.","lessons_zh":"可借鉴：一个洞察——硕士申请完全可以无实体分公司做全国生意，精品机构可以远程优先、压低固定成本。需避免：其余全部——买量+电销获客与高端定位相克；超卖产能（客户数超过资深团队承接力）是其投诉根源；绝不能放任一亩三分地/知乎负评无人回应，因为美英研究生申请人恰恰只看这些帖子。","confidence":"medium","sources":"https://www.1point3acres.com/bbs/thread-1176323-1-1.html, https://www.zhihu.com/question/28208063, https://baike.baidu.com/item/百利天下教育/3107008, http://www.qianmu.org/百利天下留学, https://www.douban.com/group/topic/80922604/","category_key":"cn-mega","_founded":2004,"_team":1000,"_fund":null,"_cn":true},{"name_en":"EIC Education","name_zh":"启德教育","country":"China","founded":"2000 (Guangzhou)","status":"active — top-3 player; 4 failed listing attempts 2015-2018, still private","ownership":"Private; founder Li Zhu (李朱) + management + PE fund NLD (bought back control from CVC Capital Partners in 2016). CVC held control 2013-2016","funding":"CVC控股投资 2013 (amount undisclosed); 2016 management/NLD buyback from CVC (created ~RMB 4.7B goodwill); failed HK IPO 2015 (target US$300-500M); failed A-share backdoor deals: 四通股份 RMB 4.5B (2016-17), 神州数码 RMB 4.65B (2018)","team_size":"~3,000+ employees; 59-75 branches across 36-43 cities + 7 overseas offices (AUS/UK/CA). Basis: company about-page and baike figures","target_dest":"UK/AUS/HK/SG/US/CA/EU/JP — all destinations, historically AUS/UK-strong","segment":"Full funnel but Masters-heavy: study-abroad consulting was 75% of revenue (2018 disclosure), and UK/HK/AUS taught-Masters volume is the core; test prep 25%","pricing":"Mass-market to mid-premium: UK Masters reportedly ~RMB 10k-15k base tier up to RMB 30k-60k for premium/US grad packages (est., medium confidence)","business_model":"Full-service agency + test prep + study tours + annual education exhibitions (启德国际教育展); branch sales network; university commission income on top of client fees","marketing_channels":"Annual 《中国留学白皮书》 (industry-standard data report since 2015), large offline education expos, Baidu SEM, WeChat 公众号, 小红书/抖音 branch account matrices, 知乎 institutional accounts","marketing_notes":"2025-26: purely institutional brand (no founder IP; long-time CEO 黄娴 departed 2021). Its White Paper is arguably the best content-marketing asset in the industry — media cite it, giving free authority. Offline expo model aging; digital presence is a many-account matrix chasing 小红书 leads like everyone else. Follower counts not independently verifiable via search","marketing_budget_est":"est. RMB 150-400M/yr (low confidence): historically sales-expense-heavy (a factor regulators questioned in listing reviews), runs national expos + big SEM spend on ~RMB 1B+ revenue base","revenue_est":"RMB 7.8亿 (2014), 9.47亿 (2015), 11.27亿 (2017), 6.05亿 (Jan-Jul 2018); current est. RMB 10-15亿/yr (medium confidence)","valuation":"Priced at RMB 4.5-4.65B in 2016-2018 failed deals; no current mark","investors":"CVC Capital Partners (exited 2016), NLD (纳合诚投资) and founder consortium","positioning_en":"The data-authority mega agency: 'professional, research-driven, international' full-service giant, second tier of trust behind New Oriental, strongest historically in Australia/UK and now HK/SG Masters volume.","positioning_zh":"\"数据权威型\"大机构：以白皮书和展会塑造\"专业、研究驱动、国际化\"形象的全服务巨头，品牌信任度仅次于新东方，传统强项是澳英，现在主打港新英硕士走量。","problems_en":"黑猫投诉 pattern: '霸王条款' contracts refunding only 10% after zero substantive service (RMB 60k retained); branch managers promise 80% refunds then leave and successors renege; misleading application advice. Structural: 4 failed listings show capital markets doubted its high goodwill, consultant churn and profit durability; heavy fixed branch costs; no founder story or personality in a 小红书 era that rewards people over logos.","problems_zh":"黑猫投诉典型案例：未提供实质服务却按\"霸王条款\"只退10%（6万服务费被扣）；分公司负责人承诺退80%后离职、继任者不认账；顾问隐瞒申请实情导致多交费。结构性问题：四次上市失败暴露资本市场对其巨额商誉、顾问流失率和持续盈利能力的质疑；重资产分公司成本高；在\"认人不认logo\"的小红书时代缺乏创始人故事和人格化IP。","lessons_en":"Copy: own a proprietary annual data report — EIC's White Paper wins years of free media citations and positions it as the adult in the room; a boutique can do a niche version (e.g. 'UK/HK Masters admissions data report for Chinese applicants'). Avoid: promise-by-individual-manager culture where commitments die with staff departures — put everything in writing at the firm level; avoid refund terms that read as traps.","lessons_zh":"可借鉴：做自己的年度数据报告——启德白皮书换来多年免费媒体引用和\"行业权威\"地位，精品机构完全可以做垂直版（如《中国学生英港硕士申请数据报告》）。需避免：承诺跟着员工走、人走账赖的文化——所有承诺必须落在公司层面的书面文件上；退费条款绝不能写成陷阱。","confidence":"high","sources":"https://www.eic.org.cn/, https://www.jiemian.com/article/2507673.html (启德上市5年4败), http://www.duozhi.com/company/201702105786.shtml, https://finance.sina.com.cn/roll/2018-10-13/doc-ifxeuwws3700406.shtml, https://tousu.sina.com.cn/company/view/?couid=1311923901, https://www.jiemodui.com/N/122465.html, https://www.eic.org.cn/Report/cn_report_new_2026/","category_key":"cn-mega","_founded":2000,"_team":67,"_fund":null,"_cn":true},{"name_en":"Golden Bridge / Oxbridge International (Jinqiao)","name_zh":"津桥国际（津桥留学）","country":"China","founded":"1996 (Beijing, Renmin Univ. Culture Building HQ)","status":"active — small-mid UK-leaning full-service shop with immigration/property sidelines","ownership":"Private, founder-controlled (津桥国际集团); not listed","funding":"No disclosed external funding","team_size":"est. 150-400 staff: ~10 direct-operated city branches (Beijing, Tianjin etc.) + offices in 5 countries. Basis: baike/company site branch counts","target_dest":"UK-first, plus US/CA/AUS/EU — 20+ countries incl. HK/MO/TW programs","segment":"UK Masters-heavy consulting core, cross-selling immigration, overseas property and language training","pricing":"UK Masters est. RMB 12k-30k; US premium packages claim '85% Top-30 admit rate' marketing (est., low confidence)","business_model":"Mid-size full-service agency diversified into 移民+海外置业 (higher-ticket items smooth study-abroad cyclicality); MOE/公安部/工商 tri-license heritage pitch","marketing_channels":"Baidu SEM, WeChat 公众号, CCTV/portal media features ('16 years zero complaints' claim), expos, modest 小红书/抖音 accounts","marketing_notes":"2025-26: institutional, low-noise brand; leans on regulatory-license heritage and media endorsements — a 2000s trust language that means little to 小红书-era applicants. The immigration/property cross-sell signals where its real margins are. '16年零投诉' is a self-claim contradicted by mixed Zhihu reviews. No verifiable follower counts via search","marketing_budget_est":"est. RMB 10-30M/yr (low confidence): SEM-led for a 10-branch operation","revenue_est":"No public data; est. RMB 1-3亿/yr across study abroad + immigration (low confidence)","valuation":"Unknown","investors":"None disclosed","positioning_en":"Licensed-heritage generalist with a UK tilt: sells 'ministry-approved since 1996' safety plus a one-stop bridge into immigration and overseas property for wealthier families.","positioning_zh":"有牌照情怀、偏英国的综合店：卖\"1996年起教育部批准\"的安全感，并向较富裕家庭一站式延伸移民和海外置业。","problems_en":"Sub-scale in every direction — too small for brand trust, too broad for specialist credibility; Zhihu reviews mixed on consultant quality; 'zero complaints' self-claims undermine credibility; The Paper's coverage of vanishing mid-size agencies ('走到一半的留学路') illustrates the existential risk tier it sits in; immigration cross-sell exposes it to that sector's refund-dispute reputation.","problems_zh":"各方向都不够规模——论品牌信任不如大所，论专业聚焦不如工作室；知乎对顾问水平评价不一；\"零投诉\"式自夸反伤可信度；澎湃《走到一半的留学路》所描写的中型中介消失潮正是它所处的风险层；移民业务的退费纠纷名声也会反噬留学主业。","lessons_en":"Copy: little — but its immigration/property adjacency shows there IS high-ticket wallet share around admissions clients (a boutique can partner rather than build). Avoid: stacking sidelines before the core is defensible; leaning on licenses and old-media endorsements as trust language — modern applicants trust visible casework and named consultants instead.","lessons_zh":"可借鉴：不多——但其移民/置业延伸证明申请客户周边确有高客单钱包份额（精品机构可用合作而非自建来吃）。需避免：核心业务尚无护城河就堆副业；用牌照和传统媒体背书当信任语言——现在的申请人只信可见的案例和实名顾问。","confidence":"medium","sources":"https://baike.baidu.com/item/津桥留学/785251, https://www.zhihu.com/question/315059420, https://m.oxbridgedu.org/, https://www.thepaper.cn/newsDetail_forward_3297036, https://www.douban.com/note/543815444/","category_key":"cn-mega","_founded":1996,"_team":275,"_fund":null,"_cn":true},{"name_en":"IDP Education China / IDP-Noahs (EXTRA — added: foreign-owned giant competing in-category)","name_zh":"IDP诺思留学（IDP教育集团中国）","country":"Australia (China operations)","founded":"IDP founded 1969 (Australian government origin); entered China 1993; merged with Beijing Noahs (诺思) 2015","status":"active but pressured — parent IDP Education (ASX: IEL) suffered severe FY2025 volume declines (student placement down sharply on AUS/CA/UK visa caps; major profit downgrade May 2025 crashed the stock ~50%)","ownership":"Wholly owned by IDP Education Ltd (public, ASX: IEL); co-owner of IELTS in many markets with British Council/Cambridge","funding":"Parent public company; China ops funded internally","team_size":"China: 13 offices in 11 cities (Shanghai HQ); est. 300-800 China staff (basis: office count, liepin presence); global: 100+ offices in 30+ countries","target_dest":"AUS-first heritage, plus UK/CA/NZ/US/IE — strongest where it holds formal university representation contracts","segment":"UG + Masters mixed; Masters (AUS/UK taught programs) is the China volume core; placement is commission-funded","pricing":"Low/zero client fees for represented universities (commission model); paid premium services exist (est., medium confidence)","business_model":"Global placement network: official in-country representative for hundreds of AUS/UK/CA universities + IELTS testing ownership creates structural lead flow; counselors on global IDP training standards","marketing_channels":"IELTS test-taker funnel (unique moat), idp.cn SEM/SEO, education fairs, WeChat, modest 小红书 presence; global student marketplace app (FastLane/IDP Live)","marketing_notes":"2025-26: institutional multinational brand; its IELTS relationship is the single best top-of-funnel asset in the industry, but Chinese consumers often perceive IDP as 'the Australia pipeline', and its counselors as placement (not strategy) advisers. Anglosphere visa-cap policies (AUS/CA/UK) hammered FY2025 volumes — a warning about commission-model exposure to policy","marketing_budget_est":"est. RMB 30-100M China (low confidence): fairs + SEM + IELTS co-marketing; global marketing much larger","revenue_est":"Parent FY2024 revenue ~A$1.04B group-wide (placement + IELTS); China placement slice undisclosed, est. RMB 2-6亿 (low confidence)","valuation":"ASX market cap collapsed from ~A$8B+ (2023) to ~A$1-2B range after 2025 downgrades","investors":"ASX public shareholders (Education Australia legacy stake distributed)","positioning_en":"The multinational placement machine: official university representative + IELTS owner, selling 'free, official, global-standard' counseling — really a volume channel for its client universities, squeezed hard by 2025 visa-cap politics.","positioning_zh":"跨国投递机器：手握院校官方代理和雅思考试双重身份，卖\"免费、官方、全球标准\"的咨询——本质是为签约院校输送生源的量贩渠道，2025年被各国签证配额政策重创。","problems_en":"Commission model = adviser works for the university, not the student — a conflict boutiques should name explicitly; FY2025 proved its revenue is a leveraged bet on Anglosphere visa policy; counseling depth for competitive US/UK-elite Masters is limited; China ops sub-scale vs domestic giants; brand invisible on 小红书 relative to local players.","problems_zh":"返佣模式=顾问为院校打工而非为学生——精品机构应明确点破这一利益冲突；2025财年证明其营收是对英语国家签证政策的杠杆押注；对竞争激烈的美英顶尖硕士申请咨询深度有限；中国业务规模不敌本土巨头；在小红书上的存在感远弱于本土玩家。","lessons_en":"Copy: the structural-funnel idea — own or partner with an upstream touchpoint every applicant must pass (language testing, credential evaluation, school talks); IDP shows how powerful that is. Avoid: revenue models where a third party (universities/visa policy) controls your economics; a boutique charging client-side fees is actually more resilient — say so in marketing.","lessons_zh":"可借鉴：结构性漏斗思维——占住或合作每个申请人必经的上游触点（语言考试、学历评估、择校讲座），IDP证明了它的威力。需避免：让第三方（院校/签证政策）掌控你经济模型的收入结构；向客户端收费的精品模式其实更抗风险——这一点应写进营销话术。","confidence":"medium","sources":"https://www.idp.cn/, https://www.idp.cn/special/event/20150806_Idp_Nuosi/, https://www.zhihu.com/question/35597539, IDP Education ASX:IEL FY2025 disclosures/market coverage (May 2025 downgrade), https://m.liepin.com/company/12936401/","category_key":"cn-mega","_founded":1969,"_team":550,"_fund":null,"_cn":true},{"name_en":"JiaHua ShiDa (Chivast)","name_zh":"嘉华世达（北京嘉华世达国际教育交流有限公司）","country":"China","founded":"2000-07-19 (first licensed self-funded study-abroad agency in China)","status":"active but marginal in B2C — pivoted toward institutional cooperation (university partnerships, exhibitions, Malaysia/Korea programs); its licensing moat evaporated when the State Council abolished agency-license approval in 2017","ownership":"State-owned: wholly owned by 中国留学服务中心 (CSCSE, MOE-affiliated 教育部留学服务中心)","funding":"State entity; no external funding","team_size":"Small core: 41 social-insurance participants at HQ (2023) though 38 branch entities exist (mostly local partnerships); cumulative ~150k students sent. Basis: corporate registry filings/baike","target_dest":"Broad but increasingly Belt-and-Road flavored: Malaysia, Korea, plus traditional US/UK/AUS lines; runs CIEET exhibitions","segment":"Mixed/project-based: individual agency services shrinking; growing weight on institutional programs (2+2, HND-style pathways, university MOUs) rather than Masters consulting per se","pricing":"Historically below private-market rates (state pricing ethos), est. RMB 10k-30k packages (low confidence)","business_model":"State-owned service company: agency fees + exhibition/翻译/培训/签证 services + institutional program revenue; brand equity = MOE affiliation ('the official one')","marketing_channels":"Government-adjacent channels: CSCSE events, CIEET expo, official website, university MOU announcements; essentially absent from 小红书/抖音 competition","marketing_notes":"2025-26: no meaningful consumer marketing; recent visible activity is delegations (Universiti Malaya 2024, Shinhan Univ Korea 2024, China-Malaysia student-service office 2025). The 'MOE-backed' trust card mattered when licenses were scarce; post-2017 deregulation it competes as just another small shop with a famous parent. Not founder-led, not digital","marketing_budget_est":"est. under RMB 10M/yr (low confidence): institutional events only","revenue_est":"Small; est. under RMB 1亿/yr (low confidence, from 41-person insured HQ)","valuation":"n/a (state-owned)","investors":"CSCSE (100%)","positioning_en":"The 'official' legacy agency: China's first licensed study-abroad intermediary, owned by the Ministry of Education's service center — a trust brand from the license era now drifting into institutional program brokerage.","positioning_zh":"\"官方\"老字号：中国第一家持牌自费留学中介、教育部留学服务中心全资——牌照时代的信任品牌，如今漂向院校合作项目中介。","problems_en":"Its entire moat (scarce official license) was deregulated away in 2017; tiny real staffing (41 insured) vs 38 nominal branches implies franchise-quality variance; state-entity incentives produce no consumer marketing, no digital presence, no premium service culture; mixed Zhihu reviews even in its prime; essentially irrelevant to competitive premium Masters consulting except as a channel partner.","problems_zh":"唯一护城河（稀缺官方牌照）2017年被国务院取消行政审批后清零；实际参保41人对38家挂名分支，加盟质量参差；事业单位式激励导致无消费者营销、无数字化、无高端服务文化；巅峰期知乎口碑也是毁誉参半；对高端硕士咨询市场基本已无竞争意义，更适合作为渠道合作方。","lessons_en":"Copy: nothing operationally, but strategically instructive — trust built on regulatory scarcity dies with deregulation; trust built on delivered outcomes doesn't. Also note: its state parentage (CSCSE runs degree verification) means partnership, not rivalry, is the right posture for a boutique. Avoid: resting a brand on an external endorsement you don't control.","lessons_zh":"可借鉴：运营上无，但战略上极有启发——建立在监管稀缺性上的信任会随放开而消失，建立在交付结果上的信任不会。另外，其母体（留服中心掌管学历认证）意味着精品机构对它宜合作不宜对抗。需避免：把品牌押在自己控制不了的外部背书上。","confidence":"medium","sources":"https://baike.baidu.com/item/北京嘉华世达国际教育交流有限公司, https://www.chivast.com/, https://zh.wikipedia.org/zh-hans/教育部留学服务中心, https://www.cnpp.cn/pinpai/5374.html, https://www.zhihu.com/question/35045884","category_key":"cn-mega","_founded":2000,"_team":41,"_fund":null,"_cn":true},{"name_en":"JJL Overseas Education","name_zh":"金吉列留学","country":"China","founded":"1999 (Beijing)","status":"active — still one of the largest by branch count; attempted platform pivot (金吉列大学长, 2020) largely fizzled","ownership":"Private; part of 金吉列企业集团 (founder-family controlled; chairman Zhu Yanmin 朱燕民). Never listed","funding":"No disclosed external funding; self-funded conglomerate","team_size":"~3,000 staff at claimed peak, 37-52 branches domestic + ~5 overseas; recruitment platforms (猎聘) show 1,000-2,000 band — realistic current est. 1,500-3,000. Basis: jjl.cn, liepin, baike","target_dest":"UK/AUS/CA/US/HK/SG/JP/KR/EU — 30+ countries, volume skews UK/AUS/Asia","segment":"Full funnel, mass-volume Masters core (UK/AUS taught Masters is the bread and butter); claims 1M+ cumulative cases, 80k+ offers in 3 recent years","pricing":"UK Masters ~RMB 13k-15k base (budget tier among majors); premium country packages RMB 30k-80k (est., medium confidence)","business_model":"Classic 一级代理 agency: 2,600-3,000 partner universities, commission income + client fees; consultant-sales army in walk-in branches; 2020 'JJL Daxuezhang' S2B2C online knowledge/e-commerce platform attempt to platformize consultants","marketing_channels":"Historically China's heaviest traditional advertiser in the category: CCTV, subway/outdoor, Baidu SEM; large offline 留学展; WeChat 公众号; 小红书/抖音/知乎 branch and consultant personal accounts; livestream lead-gen via 大学长 platform","marketing_notes":"2025-26: institutional brand built on ad-volume trust ('27年 old brand'), not founder IP. Pushed consultants to run personal 小红书/抖音 accounts (platformization of sales), which fragments quality control. Notably PR-dependent: paid soft-article 'Top 10 agency' rankings still a staple. Follower counts of official accounts not independently verifiable via search","marketing_budget_est":"est. RMB 100-300M/yr (low confidence): legacy of massive brand advertising + SEM + thousands-strong commissioned sales force; likely shrinking with margins","revenue_est":"No public figures; est. RMB 8-15亿/yr at scale (low confidence, extrapolated from branch count and headcount vs EIC's disclosed economics)","valuation":"Unknown; no listing","investors":"None disclosed","positioning_en":"The high-volume 'supermarket' agency: biggest branch footprint, university partnership breadth and old-brand trust for second/third-tier-city families; competes on reach and price, not craft.","positioning_zh":"\"超市型\"走量大所：分公司网点最多、院校合作最广，靠老品牌信任吃下二三线城市家庭；拼的是覆盖和价格，不是精细化服务。","problems_en":"Signature complaint: service quality collapses right after contract signing — no service delivered, RMB ~50k stuck, refunds dragged (黑猫/腾讯 coverage since 2021); consultants' credentials allegedly embellished; students churned through multiple consultants amid chaotic handovers; employees complain of low pay, complex hierarchy and burn-out — the turnover directly damages clients. Strategic: budget-tier pricing + commission dependence makes it structurally biased toward partner schools, a trust flaw savvy 小红书-era students now openly discuss.","problems_zh":"标志性投诉：签约收钱后服务断崖——不提供服务、5万元卡着不退、退款拖延（2021年起腾讯/黑猫多次报道）；顾问学历包装造假质疑；顾问频繁离职、学生被多次转手、交接混乱；员工吐槽薪资低、层级复杂、加班严重——人员流失直接伤害客户。战略层面：低价+院校返佣依赖使其天然偏向合作院校推荐，这一利益冲突在小红书时代已被学生公开讨论。","lessons_en":"Copy: nothing operationally — but note how durable a 'trusted old brand' aura is in lower-tier cities; brand age itself is an asset worth building early. Avoid: commission-driven school steering (a boutique should be able to say 'we take no university commissions' as a differentiator), consultant handover chaos, and paying for fake ranking soft articles — students now screenshot and mock them.","lessons_zh":"可借鉴：运营上几乎没有——但\"老品牌\"光环在下沉市场极其耐用，品牌资历本身值得尽早积累。需避免：返佣驱动的院校引导（精品机构应能明确承诺\"不拿院校返佣\"作为差异化）、顾问交接混乱、以及购买假榜单软文——现在的学生会截图群嘲。","confidence":"high","sources":"https://news.qq.com/rain/a/20210310A02X2Y00, https://www.zhihu.com/question/30695443, https://tousu.sina.com.cn/complaint/view/17378055102, https://www.jjl.cn/about, https://baike.baidu.com/item/金吉列大学长, http://www.duozhi.com/industry/insight/2020050810411.shtml, https://m.liepin.com/company/5963930/","category_key":"cn-mega","_founded":1999,"_team":45,"_fund":null,"_cn":true},{"name_en":"Lisichen Overseas Study / Liuxue360","name_zh":"立思辰留学（原立思辰留学360）","country":"China","founded":"2014 (as 叁陆零教育/留学360, Shanghai); acquired 2016 by A-share listco 立思辰 for RMB 344M; current operating entity registered 2017","status":"active but retrenched — parent pivoted into 豆神教育 (SZ:300010, 'Doushen', big-language-arts focus); international arm cut registered capital from RMB 10M to 2M in 2023 (retrenchment signal); forced to drop '360' from name after Qihoo 360 trademark suit (2018, RMB 50M claim/asset freeze)","ownership":"Member company of Doushen Education group (SZ:300010, formerly 立思辰); public-listco affiliated","funding":"Acquired for RMB 344M (2016) by 立思辰; no independent rounds since","team_size":"est. 100-400 staff: claims network across 36 cities and 3,000+ partner institutions, but 2023 capital reduction and internet-first model imply lean ops. Basis: baike registry data + company claims","target_dest":"30+ countries — deliberately long-tail: NZ, Ireland, Malaysia, Thailand, Switzerland alongside US/UK/AUS","segment":"UG + Masters mixed, volume tilted to lower-ranked/long-tail destinations where university commissions fund 'zero-fee' offers","pricing":"'Zero agency fee' for many partnered universities (commission-funded); paid packages for competitive destinations (est. RMB 10k-30k, low confidence)","business_model":"Internet marketplace agency: massive SEO site network (country-specific domains like us.liuxue360.com), online consultant matching, revenue from 800+ signed overseas institution partnerships (commissions) more than client fees","marketing_channels":"SEO content farms at scale (its founding DNA), Baidu SEM, WeChat; weibo institutional account; light 小红书 presence; PR awards ('2024 brand influence education group')","marketing_notes":"2025-26: the 2014-era 'internet 留学' disruptor thesis (online + zero-fee) has aged: SEO traffic is dying under 小红书/AI search, and zero-fee commission models steer students to paying partner schools — a conflict boutiques can attack. Institutional brand; founder Luo Cheng's team no longer prominent. Capital reduction in 2023 says the listco is minimizing exposure. No verifiable follower counts via search","marketing_budget_est":"est. RMB 10-30M/yr (low confidence): mostly content/SEO ops + SEM, no offline network","revenue_est":"No recent disclosure; est. under RMB 2亿/yr (low confidence)","valuation":"RMB 344M at 2016 acquisition; current value likely far below (2023 capital cut)","investors":"Doushen Education (SZ:300010) shareholders","positioning_en":"The internet-marketplace agency: 'apply online, zero agency fee, 30+ countries' — a volume commission machine for less-selective destinations, living inside a distracted listed parent.","positioning_zh":"互联网平台型中介：\"在线办理、零中介费、30多国\"——面向门槛较低目的地的返佣走量机器，寄居在一个心不在焉的上市母公司里。","problems_en":"Zero-fee = commission-steering: only partner schools qualify, so 'free' advice is structurally biased; parent's serial identity crises (立思辰→豆神, K12 pivot, 双减 damage) starve the unit; lost trademark fight forced rebrand and RMB 50M freeze; 2023 capital reduction signals strategic neglect; SEO-farm acquisition model collapsing in the 小红书/AI-search era; thin senior consulting bench for competitive Masters applications.","problems_zh":"零中介费=返佣引导：只有合作院校才\"免费\"，建议天然带偏向；母公司连环转型（立思辰→豆神、押注大语文、双减重创）令留学板块失血；商标官司败走、被冻结5000万并被迫改名；2023年减资透露战略性放弃倾向；SEO农场获客模式在小红书/AI搜索时代崩解；缺乏能打竞争性硕士申请的资深顾问梯队。","lessons_en":"Copy: its early lesson that content at scale captures long-tail search demand — the 2026 equivalent is owning AI-search/小红书 answers for niche queries ('non-JD law Masters HK', etc.). Avoid: 'free' models funded by school commissions if positioning as a client-side premium advisor — disclose incentives loudly; and avoid corporate parents whose strategy changes yearly.","lessons_zh":"可借鉴：早年的启示——规模化内容能吃掉长尾搜索需求，2026年的对应做法是占领AI搜索/小红书上细分问题（如\"香港法学硕士非法本申请\"）的最佳答案。需避免：立志做客户侧高端顾问就不能靠院校返佣做\"免费\"模式——利益必须高调披露；也要避开战略年年变的母公司。","confidence":"medium","sources":"https://m.21jingji.com/article/20180726/herald/631ee556d8be96e00354d2be22c04f10_zaker.html, http://corp.liuxue360.com/, https://baike.baidu.com/item/上海立思辰出国留学服务有限公司, https://www.zhihu.com/question/62345512, http://us.liuxue360.com/news/04494729.html","category_key":"cn-mega","_founded":2014,"_team":250,"_fund":null,"_cn":true},{"name_en":"New Channel Qiancheng Overseas Study (EXTRA — added: significant test-prep-fed competitor)","name_zh":"新航道前程留学","country":"China","founded":"2004 (New Channel group, Beijing, founder Hu Min 胡敏 — ex-New Oriental president, 'father of Chinese IELTS')","status":"active — group has 40+ schools/branches and 300+ learning centers; consulting arm (前程留学) riding the group's IELTS funnel","ownership":"Private; founder-controlled (Hu Min family/management); early strategic investment from Kaplan reported in the 2000s (later restructured — low confidence detail)","funding":"No recent disclosed rounds; group self-funded from cash-rich test-prep business","team_size":"Group: 40+ schools, 300+ learning centers, est. 5,000-10,000 group staff; 前程留学 consulting arm est. 300-800 (low confidence). Basis: xhd.cn about-page, baike","target_dest":"US/CA/UK/AUS/HK/SG/NZ/IE","segment":"Test-prep-first with Masters consulting attached: IELTS/TOEFL students up-sold into UK/HK/AUS Masters applications — the same funnel logic as New Oriental at smaller scale","pricing":"Masters consulting est. RMB 20k-50k; bundles with prep courses (est., low confidence)","business_model":"Language-training cash engine (its 'core') + consulting up-sell; 'admission officer resources + returnee consultants + foreign editors' pitch; university partnerships incl. joint programs with PKU/Renmin","marketing_channels":"300+ physical learning centers as lead machines, Baidu SEM, 抖音/B站 English-learning content (prep teachers as micro-IPs), WeChat, 小红书 accounts per city school","marketing_notes":"2025-26: founder-led halo (Hu Min books/talks) plus teacher micro-IPs — structurally better suited to short-video era than pure agencies because prep teachers generate daily content naturally. Consulting arm itself is a second-class citizen internally; quality perceived as uneven vs specialist agencies (Zhihu). Follower counts not verified via search","marketing_budget_est":"est. RMB 100-300M/yr group-wide, of which study-abroad consulting a minor share (low confidence)","revenue_est":"Group est. RMB 20-40亿 incl. training; consulting arm est. RMB 1-3亿 (low confidence)","valuation":"Unknown (private)","investors":"Founder/management; historical Kaplan strategic stake (reported, low confidence)","positioning_en":"The 'mini New Oriental': an IELTS-first empire whose consulting arm converts captive prep students into Masters applications — competing on funnel economics, not consulting craft.","positioning_zh":"\"小新东方\"：以雅思为先的培训帝国，其前程留学把自家考培学员转化为硕士申请客户——赢在漏斗经济学，而非咨询手艺。","problems_en":"Consulting is subordinate to the training P&L, so senior consulting talent is thin; conversion-driven advising can push clients toward whatever keeps them in the funnel; brand means 'IELTS' not 'admissions' in consumers' minds; same refund/complaint patterns as peers on training courses; founder succession question (Hu Min b.1963).","problems_zh":"咨询板块从属于培训损益表，资深咨询人才储备薄；转化导向的建议可能优先留住学员而非最优申请方案；品牌心智是\"雅思\"而非\"申请\"；培训课程端同样存在退费投诉；创始人接班问题（胡敏1963年生）。","lessons_en":"Copy: the funnel insight without the conflict — partner with (don't build) IELTS/GMAT tutors for referral flow; and note how teacher micro-IPs make content cheap and constant. Avoid: letting a cash-cow side business define the brand so the consulting arm never earns standalone credibility.","lessons_zh":"可借鉴：只取漏斗洞察、不背利益冲突——与雅思/GMAT老师建立转介合作而非自建培训；并学习\"老师微IP\"如何让内容生产便宜且持续。需避免：让现金牛副业定义品牌，导致咨询业务永远建立不起独立信誉。","confidence":"medium","sources":"https://www.xhd.cn/about, https://baike.baidu.com/item/新航道, https://zhuanlan.zhihu.com/p/580450312, https://bj.xhd.cn/topic/jtjj/humin.html","category_key":"cn-mega","hq":"Beijing (parent New Channel operates in 40+ Chinese cities)","_founded":2004,"_team":7500,"_fund":null,"_cn":true},{"name_en":"New Oriental Vision Overseas (Qiantu Chuguo)","name_zh":"新东方前途出国","country":"China","founded":"2004 (as subsidiary; New Oriental study-abroad services trace to 1996)","status":"active — market leader; growth slowing sharply (FY2025 Q4 consulting revenue +8.2% YoY vs +20-31% earlier quarters)","ownership":"Subsidiary of New Oriental Education & Technology Group (public: NYSE EDU / HKEX 9901); founder Yu Minhong","funding":"No standalone funding; funded by parent. New Oriental FY2025 group revenue US$4.9B; study-abroad consulting est. ~US$700-850M (17% of FY2024 US$4.31B revenue = ~US$733M, grew ~15-20% into FY2025)","team_size":"~2,000+ study-abroad service mentors/consultants (company claim, Jul 2025); 43-55 branch offices in China + overseas offices in London, Sydney, Melbourne, Toronto, Tokyo. Basis: company disclosures/baike","target_dest":"US/UK/HK/SG/AUS/CA/EU/JP — all major destinations","segment":"K12-PhD full funnel; Masters (esp. UK/HK/SG) is now the volume and growth engine as US demand wavers","pricing":"UK Masters: ~RMB 25k-40k service fee + RMB 15-18k third-party costs = ~RMB 40k-58k all-in; US grad packages higher (est. RMB 60k-150k). Mid-premium of mass market","business_model":"Full-service agency: application consulting + test prep cross-sell (parent's core), background enhancement, visa, 'full-cycle' services (career planning, cultural adaptation) to raise LTV; branch-based sales force","marketing_channels":"Nationwide branch walk-in + school seminars, annual 《中国留学白皮书》 content marketing, 留学展, Baidu SEM, WeChat 公众号 ecosystem, 小红书/抖音 multi-account matrix per city branch, livestreaming leveraging New Oriental teacher IPs","marketing_notes":"2025-26: institutional brand, not founder-led (though Yu Minhong's personal fame + Dongfang Zhenxuan halo feeds top-of-funnel). Runs city-branch account matrices on 小红书/抖音 with private-message lead capture — the model 小红书 itself cites (New Oriental Online) as a lead-gen success case. Exact follower counts per account not independently verifiable via search; presence is broad but engagement is corporate/bland vs boutique studios. Also mining new niches ('银发留学'/senior study tours) as core demand slows","marketing_budget_est":"est. RMB 400M-1B on study-abroad-related marketing (low confidence): parent group selling & marketing is ~US$600-700M/yr; consulting arm carries huge branch sales headcount + SEM + exhibitions","revenue_est":"~US$700-850M FY2024-25 study-abroad consulting (medium-high confidence, derived from EDU earnings disclosures of segment share and growth rates)","valuation":"Not separately valued; parent EDU market cap ~US$7-10B range in 2025","investors":"Public shareholders of EDU; no separate investors","positioning_en":"The default 'safe big brand' one-stop shop: largest study-abroad consultancy in China, selling trust, scale and test-prep integration to middle-class families across every destination and degree level.","positioning_zh":"全行业默认的\"大品牌保险选项\"：中国规模最大的留学咨询机构，靠品牌信任、网点规模和考培联动，向中产家庭提供覆盖所有国家、所有学段的一站式服务。","problems_en":"Heavy 黑猫投诉 record: refund clauses letting them keep 50% after delivering only an info-collection form or a school list; months-long refund delays; 'store bullies customer' (店大欺客) complaints; sales-driven consultants with high turnover; templated essays at scale; FY2025 Q4 consulting growth collapsed to 8.2% as US policy fears bite and some parents abandon study abroad altogether.","problems_zh":"黑猫投诉量大：只发了一张信息采集表或一份选校方案就按合同扣50%费用、退款拖延数月、\"店大欺客\"式售后；顾问销售导向、流动率高；规模化生产的模板化文书；2025财年Q4咨询业务增速骤降至8.2%，美国政策不确定性下部分家长直接放弃留学。","lessons_en":"Copy: full-cycle LTV thinking (application → career → adaptation) and authoritative annual data reports as trust-building content. Avoid: contract terms that weaponize refund ratios — they generate the complaint record boutiques can position against; and don't let sales incentives own the client relationship. A boutique's pitch writes itself: 'the anti-assembly-line' versus Qiantu's scale.","lessons_zh":"可借鉴：\"全周期LTV\"思路（申请→就业→海外适应）和年度白皮书式权威内容营销建立信任。需避免：把退费比例写成霸王条款——这正是精品机构可以攻击的投诉痛点；也不要让销售激励主导客户关系。精品机构的定位可以直接对标：\"反流水线\"，打新东方规模化的反面。","confidence":"high","sources":"https://liuxue.xdf.cn/, https://baike.baidu.com/item/北京新东方前途出国咨询有限公司, http://www.duozhi.com/industry/earnings/2024073116465.shtml, https://www.21jingji.com/article/20250731/herald/1def3e11eedfbda4ff61b38089930266.html, https://finance.sina.com.cn/roll/2025-05-24/doc-inexryra5045141.shtml, tousu.sina.com.cn (黑猫投诉 新东方前途出国 multiple threads), https://ulec.com.cn/posts/2026-yingguo-shuoshi-zhongjie-feiyong/","category_key":"cn-mega","_founded":2004,"_team":49,"_fund":null,"_cn":true},{"name_en":"Shinyway Education","name_zh":"新通教育","country":"China","founded":"1996 (Hangzhou); chairman Ma Yawei 麻亚炜","status":"active — East-China regional champion, state-invested, quietly stable","ownership":"浙江新通教育科技股份有限公司; private with state minority investment (国有参股); founder/chairman-led","funding":"No public funding rounds disclosed; state-capital participation, terms undisclosed","team_size":"Claims 3,000+ full-time staff across 20+ cities globally (company/PR figure; realistic core likely 1,500-3,000). Basis: company about-page and PR profiles","target_dest":"UK/AUS/HK/SG/US/EU/JP — full spread; East-China client base","segment":"Full funnel: study abroad + 新通外语 language training + international courses; Masters (UK/HK/AUS) is the volume core of the consulting arm","pricing":"Mass-market to mid-premium; UK Masters est. RMB 15k-35k, premium US packages higher (est., low confidence)","business_model":"Regional integrated ecosystem: test prep feeds consulting feeds visa/settlement; strong government/school channel relationships in Zhejiang (国资 ties); once experimented with '乐学城' education-mall real estate concept","marketing_channels":"Dominant offline presence in Zhejiang (branches, school partnerships, expos), Baidu SEM, WeChat, 小红书/抖音 accounts, and conspicuously heavy paid soft-article PR (Sohu/中华网/东方财富 'ranked No.1' advertorials throughout 2025)","marketing_notes":"2025-26: institutional brand; its most visible tactic is advertorial saturation — multiple 2025 paid articles claiming 'No.1 in reputation/service/success rate' with implausible stats (98.8% employment, >50% top-school admits). This buys search-result control but reads as inauthentic to 小红书-native students. No founder IP; no verifiable follower counts via search","marketing_budget_est":"est. RMB 50-150M/yr (low confidence): regional expos + SEM + visible advertorial volume on ~3,000-staff cost base","revenue_est":"No public data; est. RMB 6-12亿/yr including language training (low confidence)","valuation":"Unknown","investors":"State capital (unnamed vehicle), founder/management","positioning_en":"The Zhejiang/East-China incumbent: government-blessed, full-ecosystem regional giant that owns its home market's school relationships and plays a 'trustworthy establishment' card nationally.","positioning_zh":"浙江/华东地头蛇：有国资背书、生态齐全的区域巨头，深耕本地院校关系，对外打\"正规军、值得托付\"这张牌。","problems_en":"Search results are almost entirely self-planted PR — a sign organic reputation is thin; standard mega-agency complaints (consultant churn, templated essays) circulate on Zhihu; regional concentration means national expansion has repeatedly stalled; state-linked governance can slow decision-making; implausible advertised stats (98.8% employment rate) create credibility risk if challenged.","problems_zh":"搜索结果几乎全是自投软文——说明自然口碑单薄；知乎上流传大机构通病（顾问流失、模板文书）；业务高度集中华东，全国化屡屡受阻；国资参股背景下决策偏慢；98.8%就业率这类夸张宣传数据一旦被较真就是信誉风险。","lessons_en":"Copy: regional density beats national thinness — Shinyway's Zhejiang school-channel depth generates referral flow money can't buy; a boutique should dominate one city/channel before expanding. Avoid: advertorial-stuffed search results with fantasy statistics — sophisticated Masters applicants cross-check and it destroys trust with exactly the premium clients worth having.","lessons_zh":"可借鉴：区域密度胜过全国摊薄——新通在浙江的院校渠道深度带来花钱买不到的转介绍流量；精品机构应先吃透一座城市/一个渠道再扩张。需避免：用幻想数据刷软文霸屏——高端硕士申请人会交叉验证，这恰恰会在最值得服务的客群里摧毁信任。","confidence":"medium","sources":"https://www.xt.cn/aboutus/, https://baike.baidu.com/item/新通教育/6307746, https://news.qq.com/rain/a/20210630A0AAIE00, https://m.sohu.com/a/919792654_109958 (advertorial example), https://caifuhao.eastmoney.com/news/20250801174140687625760 (advertorial example), https://www.zhihu.com/question/54810523","category_key":"cn-mega","_founded":1996,"_team":2250,"_fund":null,"_cn":true},{"name_en":"Tiandao Education","name_zh":"天道教育（天道留学）","country":"China","founded":"2002, Beijing, by Shi Lingkong (石凌空); operating entity 北京天道恒信咨询有限公司 (2006, RMB 2M registered capital, 50/50 held by husband-and-wife 石凌空/李丽芳)","status":"defunct — spectacular Dec 2022 collapse ('爆雷/跑路'): founder unreachable, RMB 14.23M+ student refunds owed, RMB 1.32M wages owed, social accounts dead since Nov 2022; the earlier spun-off faction 天道智酷 continued separately at small scale","ownership":"Founder/family-owned (husband-wife 50/50) — never took meaningful institutional capital; that governance structure is central to the post-mortem","funding":"Essentially bootstrapped; no significant disclosed VC. Growth funded by client prepayments — which is what made the collapse a consumer-harm event","team_size":"0 now; peak claimed in media as ~5,100 staff across 14 branches with ~RMB 500M revenue (reported figure, plausibly inflated; core professional staff likely 1,000-2,000). Basis: Backchina/界面 collapse coverage","target_dest":"US-first high-end (Top-30 obsession), plus UK/HK/SG","segment":"Masters/PhD-heavy: Tiandao was the reference brand for premium US graduate admissions ('高端申请') for 15 years — the closest historical analogue to what AcademiaOne wants to be at scale","pricing":"Premium: RMB 50k-300k packages; the reported individual refund claims of RMB 10k-230k per student map to this range (corroborated by collapse reporting)","business_model":"Prepaid multi-year premium consulting (regularly signed clients 2-3 years pre-application) + test prep + research/background-enhancement add-ons; prepayments functioned as float across a 14-branch fixed-cost base","marketing_channels":"Legacy: Baidu SEM, offer-list PR ('offer榜'), campus talks, WeChat 公众号 matrix, 知乎; all accounts stopped updating early Nov 2022 — itself the public tell of the collapse","marketing_notes":"Post-mortem note: Tiandao's marketing was institutional and offer-list-driven; its trust asset (20-year brand, claimed Top-30 offer counts) let it collect very large multi-year prepayments — which magnified consumer harm when it failed. The one-month gap between accounts going silent (Nov 2022) and public 爆雷 (Dec 2022) shows social-channel silence is a leading indicator competitors/clients watch","marketing_budget_est":"N/A (defunct); at peak est. RMB 30-80M/yr across SEM + 14 branches (low confidence)","positioning_en":"For two decades the benchmark premium US-grad-admissions house in China — killed not by competitors but by COVID-era US demand collapse hitting a fixed-cost branch network funded entirely by client prepayments, with zero external capital buffer and husband-wife 50/50 governance that allowed no intervention.","positioning_zh":"二十年来中国高端美研申请的标杆机构——杀死它的不是同行，而是疫情叠加中美关系导致的美国申请需求骤降，砸在一个完全靠客户预付款支撑的14城重资产分公司网络上；夫妻店50/50股权结构又让任何外部纠偏都无从谈起。","problems_en":"(1) Demand shock 2020-22: US applications (its core) cratered with COVID + US-China tension, while 14 branches' rent/payroll ran on. (2) Prepayment float: multi-year premium contracts (up to RMB 230k per family) were spent as working capital; when new signings slowed, old obligations became unpayable — RMB 14.23M+ refunds owed to students across 6+ provinces at collapse, plus RMB 1.32M wages. (3) Governance: 50/50 husband-wife holding, no board, no investor oversight; internal partner conflict had already split the firm (天道智酷 faction) around 2020, fracturing brand and talent. (4) Founder Shi Lingkong went unreachable (失联) rather than managing an orderly wind-down — clients learned from frozen WeChat groups and leaked internal videos. (5) A student paid RMB 128k weeks before the collapse — sales kept selling into insolvency, converting a business failure into something close to fraud. (6) No legal separation between client escrow and opex existed at any point.","problems_zh":"(1) 2020-22需求冲击：核心的美国申请因疫情和中美关系断崖下滑，而14个分公司的房租工资照常烧；(2) 预付款资金池：多年期高端合同（单户最高23万元）被当运营资金花掉，新签放缓后旧义务无法兑付——爆雷时欠学员退费超1423万元、涉及六省以上，欠薪132万元；(3) 治理缺陷：夫妻50/50持股、无董事会、无投资人监督；约2020年内部合伙人矛盾已分裂出天道智酷一支，品牌与人才先行流失；(4) 创始人石凌空选择失联而非有序清盘——客户是从冻结的微信群和流出的内部视频里得知真相的；(5) 有学员在爆雷前几周刚付12.8万元——销售在资不抵债时仍在收款，把经营失败变成了近乎欺诈；(6) 客户资金与运营支出自始至终没有任何隔离。","lessons_en":"This is THE case for AcademiaOne to study. Copy: the premium-Masters positioning, 20-year trust compounding, offer-list marketing. Avoid: (a) multi-year prepayment dependence — bill in milestones, hold client funds in a separate account, and let clients see it; (b) fixed-cost branch expansion against cyclical demand — stay lean/remote-first; (c) concentration in a single destination (Tiandao was ~US-only when the US closed) — AcademiaOne's UK/HK/SG/US/AU spread is the direct hedge; (d) opaque governance — even a boutique should have an advisory board and a wind-down-with-dignity plan, because in this industry HOW you would fail is part of the sales conversation with sophisticated parents.","lessons_zh":"这是安可学途最该精读的案例。该学：高端硕博定位、二十年信任复利、offer榜营销。该避：(a) 依赖多年期预付款——按里程碑收费、客户资金独立账户并对客户可见；(b) 用重资产分公司网络去对赌周期性需求——保持轻资产/远程优先；(c) 目的地单一集中（天道几乎all in美国，美国一关门就窒息）——安可英/港/新/美/澳的分散正是对冲；(d) 治理不透明——精品机构也应有顾问委员会和“体面退场”预案，因为在这个行业，“你会怎么倒下”本身就是与高知家长销售对话的一部分。","confidence":"high","sources":"jiemian.com/article/8496280.html, backchina.com/news/2022/12/03/832024.html, k.sina.cn (知名留学机构跑路 2022-12), zhihu.com/question/521118146, baike.baidu.com 天道教育","hq":"Beijing (defunct); had 14 branches nationwide at peak","investors":"None material — founder/family owned","revenue_est":"0 now; reported ~RMB 500M/yr at peak (media figure, medium confidence)","valuation":"0","category_key":"cn-mega","_founded":2002,"_team":1500,"_fund":null,"_cn":true},{"name_en":"Wiseway International Education","name_zh":"威久留学","country":"China","founded":"1999 (Beijing Wiseway Consulting est. 1999-06-23; MOE license 2000)","status":"active — mid-size UK specialist; parent 东西万方 listed on NEEQ (新三板) May 2016 as '东西方', code 837491","ownership":"Parent: 上海东西万方教育科技股份有限公司 (NEEQ: 837491, listed May 2016 — first international-education NEEQ listing); effectively founder/management controlled","funding":"NEEQ listing 2016 (minimal liquidity/capital raised; NEEQ is a quotation board)","team_size":"est. 200-500 staff: ~10 domestic branches (Beijing, Shanghai, Nanjing, Wuhan, Xi'an, Zhengzhou etc.) + UK/US/AUS offices; ~2,000+ UK students placed/yr. Basis: company site, baike","target_dest":"UK-first (deepest UK heritage among mid-tier agencies), plus US/AUS/CA","segment":"UK-first, Masters-heavy: UK taught Masters is the core volume; also UG/foundation via parent's A-Level/ISAP course products","pricing":"UK Masters est. RMB 12k-30k; regarded as relatively expensive for its tier (est., low confidence)","business_model":"UK university partnerships (Bristol, York, dozens more) + client fees + parent company's international course/pathway products feeding student pipeline upward","marketing_channels":"Baidu SEM, WeChat 公众号, 知乎, education expos, university-partnership co-branded events; modest 小红书 presence","marketing_notes":"2025-26: quiet institutional brand; competes on UK-heritage credibility rather than digital reach. Third-party review platforms put complaint rate ~0.2%/yr (mainly essay-delivery delays and consultant mid-service departures), satisfaction ~4.0/5 — middle-of-pack. No founder IP, no notable social-media innovation; exactly the profile being squeezed between New Oriental's scale and 小红书-native UK boutiques","marketing_budget_est":"est. RMB 10-30M/yr (low confidence): SEM + expos for a ~10-branch operation","revenue_est":"No recent public figures; est. RMB 1-3亿/yr (low confidence)","valuation":"NEEQ quotation, negligible trading; no meaningful mark","investors":"NEEQ public quotation; management","positioning_en":"The steady old UK specialist: 25+ years of UK partnerships and visa know-how, selling reliability to families who want a smaller shop than New Oriental but an older license than a studio.","positioning_zh":"稳健的英国老专门店：25年+英国院校合作与签证经验，卖点是\"比新东方小、比工作室老\"的可靠感。","problems_en":"Essay/document delivery delays and consultants leaving mid-service are its recurring complaints; premium pricing without premium differentiation; stuck in the squeezed middle — no scale advantage, no boutique intimacy, no digital-native acquisition; NEEQ listing brings disclosure burden without capital benefit; UK single-market concentration risk as UK Chinese enrollment fell 23% from its 2021/22 peak.","problems_zh":"文书返稿延迟、顾问中途离职是常年投诉点；收费偏高但差异化不足；被夹在中间——没有大所的规模，没有工作室的贴身感，也没有数字化获客能力；新三板挂牌只添披露负担不带融资好处；英国单一市场集中风险（中国留英人数已较2021/22峰值下降23%）。","lessons_en":"Copy: deep, named university relationships (Bristol/York-level partnerships) are real assets a UK-focused boutique should cultivate deliberately and publicize. Avoid: the undifferentiated middle — if you charge above mass-market you must deliver visibly above it (essay turnaround SLAs, named senior consultants who stay); Wiseway shows what slow decline looks like when neither happens.","lessons_zh":"可借鉴：有名有姓的深度院校关系（布里斯托/约克级别）是真资产，英国方向的精品机构应有意识地经营并公开展示。需避免：无差异化的中间地带——收费高于大众市场就必须交付明显高于大众的体验（文书返稿SLA、不流动的资深顾问实名制）；威久展示了两样都没有时的缓慢衰退。","confidence":"medium","sources":"https://www.jiemodui.com/N/47741.html, http://www.duozhi.com/company/201601304337.shtml, https://baike.baidu.com/item/北京威久咨询有限公司, https://www.wiseway.com.cn/about/, https://www.zhihu.com/question/57845324, https://liuxue.hanlin.com/p/60858.html","category_key":"cn-mega","_founded":1999,"_team":350,"_fund":null,"_cn":true},{"name_en":"Woodpecker Education (Zhuomuniao)","name_zh":"啄木鸟留学（原啄木鸟教育）","country":"China","founded":"2006 (Beijing), founder Chen Qiyong 陈起永","status":"active but under a distressed parent — acquired by Puxin Education 2017 (NOT Bright Scholar/博实乐 as commonly mislabeled); Puxin (ex-NYSE: NEW) entered Cayman court-ordered winding-up/debt restructuring in 2022 and delisted; brand relaunched as 啄木鸟留学 (global) Dec 2020","ownership":"Subsidiary of Puxin Education (沙云龙); Puxin in debt restructuring since 2022, continuing operations. Founder Chen Qiyong originally; note: assignment's '博实乐旗下' label is incorrect per all sources — parent is 朴新 (Puxin)","funding":"Acquired by Puxin Aug 2017 at ~RMB 3亿 annual revenue scale (price undisclosed); no independent rounds","team_size":"est. 200-600 staff (low confidence): single-country-origin premium shop, Beijing HQ + several city centers; no reliable public headcount","target_dest":"US-first (Top-50 focus), expanded to UK/CA/AUS/HK/SG after 2020 'global' rebrand","segment":"US high-school + undergrad-first heritage; Masters/PhD (硕博) a growing secondary line — NOT Masters-first","pricing":"Base packages ~RMB 40k+; US Top-50 premium packages with success-based tiered pricing (higher-ranked admit = higher fee), test prep sold alongside (medium confidence)","business_model":"High-end US admissions: planning ('留学规划师' model Chen pioneered) + activity/background building + test prep + application, sold as multi-year packages","marketing_channels":"Founder-authored books (陈起永《留学去美国》), Baidu SEM, WeChat 公众号, 知乎, offline seminars in tier-1 cities, 小红书 case-study accounts; heavy claimed-stats marketing ('80% into US Top 50')","marketing_notes":"2025-26: semi-founder-led heritage (Chen Qiyong's planning methodology is the brand story) diluted under Puxin's institutional umbrella; visible current push is SEO advertorials (Sohu 2025 posts). US-policy chill directly hits its core; the 2020 all-destination rebrand diluted the US-specialist identity. No verifiable follower counts via search","marketing_budget_est":"est. RMB 10-40M/yr (low confidence): niche premium player, mostly SEM/content, constrained by distressed parent","revenue_est":"~RMB 3亿 at 2017 acquisition; current est. RMB 1.5-3亿 given US demand slump (low confidence)","valuation":"Undisclosed at acquisition; parent Puxin's market cap collapsed below US$12M pre-delisting","investors":"Puxin Education (roll-up of 50+ brands incl. Global IELTS/环球)","positioning_en":"The original US high-end 'planning school': invented the 留学规划师 concept, promising Top-50 outcomes via years of curated activities and test prep — a premium US specialist trapped inside a broke roll-up parent.","positioning_zh":"美国高端申请\"规划派\"鼻祖：首创\"留学规划师\"概念，靠多年活动规划+考培承诺美国Top50结果——一个被困在破产重组母公司里的美国高端专门店。","problems_en":"Parent Puxin's court-ordered winding-up/debt restructuring (2022) creates existential uncertainty and starves investment; US-only heritage collided with the post-2023 US demand slump, forcing a late 'global' pivot with no UK/HK DNA; roll-up integration damaged the founder-led culture that made it good; success-rate claims (80% Top-50) invite scrutiny; complaints on Zhihu about package upselling of test-prep hours.","problems_zh":"母公司朴新2022年被开曼法院颁令清盘（自称债务重组）带来生存不确定性、投入受限；纯美国基因撞上2023年后美国需求下滑，被迫仓促\"全球化\"却没有英港积累；被并购整合后创始人文化稀释；\"80%进Top50\"的宣传经不起推敲；知乎有对捆绑销售考培课时的抱怨。","lessons_en":"Copy: the 'planning methodology as IP' move — Chen turned a service into a named, book-published framework that justified premium pricing for years; a boutique should productize and publish its method. Avoid: selling to a roll-up (acquirer distress became the brand's distress); over-concentration in one destination without a hedge — AcademiaOne's multi-destination (UK/HK/SG/US/AUS) spread is the right insurance.","lessons_zh":"可借鉴：\"方法论IP化\"——陈起永把服务变成有名字、出过书的规划体系，多年支撑溢价；精品机构应把自己的方法论产品化、出版化。需避免：卖身并购整合方（母公司暴雷=品牌暴雷）；单一目的地过度集中——AcademiaOne英/港/新/美/澳多线布局正是对的对冲。","confidence":"medium","sources":"https://m.thepaper.cn/newsDetail_forward_10393070, http://www.duozhi.com/industry/overseas/2020121111443.shtml, https://news.qq.com/rain/a/20220512A003LH00 (朴新清盘), https://baike.baidu.com/item/啄木鸟教育/4796939, https://www.zmnedu.com/, https://www.zhihu.com/question/35854800","category_key":"cn-mega","_founded":2006,"_team":400,"_fund":null,"_cn":true},{"name_en":"BeBeyond","name_zh":"BeBeyond（毕业倍勇/无常用中文名）","country":"China (founded in Chicago, operates from Shanghai)","hq":"Shanghai","founded":"1999 (Chicago); MBA Workshop created 2001, later Graduate Workshop and Career Workshop","status":"active (small, aging brand)","ownership":"Bootstrapped founder-owned boutique","funding":"None disclosed","investors":"None","valuation":"n/a","revenue_est":"est. RMB 3-10M/yr (single-site workshop boutique) — low confidence","team_size":"est. 10-40 (basis: single Shanghai operation, workshop cohort model, minimal hiring footprint)","target_dest":"US-first (MBA + graduate school), some UK/EU","segment":"Masters/MBA-first training (not agency): teaches self-driven applicants to run their own applications","pricing":"Workshop tuition not published; est. RMB 20k-45k per multi-month workshop (uniform across cohorts per official FAQ) — low confidence","business_model":"Anti-agency 'workshop' model: cohort-based training (self-discovery, positioning, essay development) + personal tutoring sessions; students write everything themselves; sells capability-building, not outcomes — philosophically the purest 'coach not agent' player since 2001","marketing_channels":"Word of mouth and alumni referral, 知乎 legacy threads, official site; near-zero paid or social presence","marketing_notes":"Essentially no modern funnel: no visible 小红书/抖音 operation, no offer-list machine. Brand survives on 20+ years of alumni goodwill among self-driven MBA/grad applicants. Institutional brand with strong internal philosophy ('help students become better, admissions follow').","marketing_budget_est":"est. <RMB 1M/yr: organic/referral only — low confidence","positioning_en":"The original 'teach you to fish' application-training house: cohort workshops where students author their own MBA/grad applications — zero ghostwriting, zero guarantees, maximal self-development.","positioning_zh":"留学申请\"授人以渔\"的鼻祖：工作坊集训模式，学员全程自己完成MBA/研究生申请——不代写、不保录，卖的是成长本身。","problems_en":"1point3acres thread (2016) attacking it as '黑心中介': no native-speaker editors, English editing limited to punctuation/formatting; model demands rare self-driven students, capping the addressable market; brand and web presence visibly aged; tiny scale means no pricing power against modern content-marketing competitors; workshop pedagogy hard to explain in a 小红书-scroll world.","problems_zh":"一亩三分地2016年有\"曝光黑心中介\"帖：不配native文书编辑、英文修改只到标点格式层面；模式只适合极少数高自驱学员，市场天花板低；品牌与官网明显老化；体量太小，在内容营销时代毫无声量；工作坊教学理念在小红书刷屏语境里很难三句话讲清。","lessons_en":"Copy: the workshop/coaching layer is the highest-integrity, lowest-refund-risk revenue in the category (you sell training delivered, not outcomes promised) — a premium boutique can embed a mini-workshop into onboarding to differentiate from ghostwriting shops. Avoid: purity without marketing — BeBeyond proves a superior philosophy with zero funnel becomes a museum piece.","lessons_zh":"可借鉴：训练营/教练式服务是本品类里交付最干净、退费风险最低的收入（卖已交付的训练而非承诺的结果）——精品机构可在服务前段嵌入mini工作坊，与代写型机构划清界限。需避免：有理念没获客——BeBeyond证明了再好的哲学，没有流量入口就会变成博物馆展品。","confidence":"medium","sources":"bebeyond.com, baike.baidu.com/item/BeBeyond, zhihu.com/question/41494376, 1point3acres.com/bbs/thread-182269","category_key":"cn-premium","_founded":1999,"_team":25,"_fund":null,"_cn":true},{"name_en":"BetterEdu (Bida)","name_zh":"毕达教育（毕达留学）","country":"China","hq":"Guangzhou (Tianhe, 大都会广场); additional presence in other southern cities","founded":"mid-2000s (self-described '国内首批留学咨询服务机构'; est. ~2005-2008)","status":"active","ownership":"Private, founder-owned bootstrapped boutique","funding":"None disclosed","investors":"None disclosed","valuation":"n/a","revenue_est":"est. RMB 10-40M/yr — low confidence","team_size":"est. 50-150 (basis: Guangzhou HQ + specialty research-group structure, small-class GRE arm; no insured-headcount data found)","target_dest":"US/UK/HK/SG, masters and PhD","segment":"Masters-first specialist — markets itself as 'the only national consultancy doing exclusively graduate-degree applications' (pre-dating Compass's similar claim); strong in business/STEM postgrad","pricing":"Premium, unpublished; forum consensus '收费比较贵，不冲top学校就浪费钱' — est. RMB 40k-100k by target tier — low confidence","business_model":"Specialty research groups organized by program/major assign a matching consultant who runs the case end-to-end (no handoff assembly line); prospective clients can interview/choose their consultant before signing; famous for public client endorsements (公开代言) — claims most public client testimonials among national agencies 5 years running; side business: ≤4-person GRE classes","marketing_channels":"知乎 institutional + consultant personal accounts, client testimonial/endorsement letters, offer 榜单, website content; limited 小红书/抖音 investment","marketing_notes":"Institutional-professional brand built on named, accountable consultants and verifiable client endorsements rather than volume content; regional gravity in South China; quiet compared with newer social-native players.","marketing_budget_est":"est. RMB 2-6M/yr: content + testimonial ops, minimal paid — low confidence","positioning_en":"South-China premium graduate-applications specialist: program-matched consultants, meet-before-you-sign, and an unusual density of publicly named client endorsements.","positioning_zh":"华南高端研究生申请专门户：按专业分组匹配顾问、签约前可先面谈选人，并以大量实名公开的学员代言作为信任背书。","problems_en":"Brand awareness weak outside 华南 and outside 知乎-era channels; premium-only stance shrinks funnel as average tickets fall industry-wide (-12% in 2025); consultant-centric model = talent retention risk (consultants can defect with reputation); aging digital presence; scale too small to absorb the marketing arms race on 小红书.","problems_zh":"品牌影响力出不了华南、出不了知乎时代的渠道；只做高端在全行业客单价下行(-12%)的2025年意味着漏斗收窄；以顾问个人为中心的模式有人才流失风险（顾问带着口碑单飞）；数字化阵地老化；体量太小，卷不动小红书的营销军备竞赛。","lessons_en":"The closest structural template to AcademiaOne among the twelve: masters/PhD-only specialization, program-level consultant matching, and meet-the-consultant-before-signing are all directly copyable trust levers that cost nothing; named public client endorsements beat anonymous offer walls. Avoid: their marketing stagnation — a specialist still has to fight for discoverability where applicants search now.","lessons_zh":"十二家中与AcademiaOne结构最像的模板：只做硕博、按专业匹配顾问、签约前面谈选人——这些信任杠杆零成本、可直接复制；实名公开的学员代言远胜匿名offer墙。需避免：它的营销停滞——专门户也必须在申请人现在搜索的地方（小红书）争夺可见度。","confidence":"medium","sources":"betteredu.net, zhihu.com/question/25484484, sohu.com/a/499437697_121124302, m.sohu.com/n/473057563, m.91goodschool.com/news/359-10224510.html, qianmu.org/毕达教育","category_key":"cn-premium","_founded":2000,"_team":100,"_fund":null,"_cn":true},{"name_en":"Compass Education (Theguider)","name_zh":"指南者留学","country":"China","hq":"Nanjing HQ; branches Beijing, Shanghai, Guangzhou, Xiamen, Changzhou, Hong Kong (7 cities)","founded":"2012","status":"active — arguably the category's healthiest operator in 2025-26","ownership":"Private, bootstrapped (no VC rounds found); founder reported as 张宁 (NTU masters grad) — medium confidence; holds MoE self-funded study-abroad agency qualification","funding":"None disclosed; appears self-funded","investors":"None disclosed","valuation":"n/a","revenue_est":"est. RMB 50-70M/yr (2,656 students in 2025 season x avg ~RMB 20k) — low-medium confidence, based on self-reported volume","team_size":"est. 300-600 full-time across 7 cities (basis: 7 offices, all-full-time 3-to-1 delivery model, claimed 300+ expert network on top; active campus hiring in Nanjing)","target_dest":"UK/HK/SG-first, plus Australia; deliberately light on US","segment":"Masters-first at scale (research-masters volume machine; 2025 season: 2,656 clients, 7,669 offers, claimed 98.2% success, 88% Top-100)","pricing":"RMB 18k-24k published masters packages, priced by number of schools/programs; transparent price list, contractual no-hidden-fees (no 名校费/排名费); 12 written service guarantees incl. full refund if any of the 3 assigned staff is not full-time","business_model":"All-full-time '3-to-1' (咨询顾问 + 申请主导师 + 文书导师) + proprietary IT: compassedu.hk website/app with program database, 1.16M registered users functioning as top-of-funnel; background-enhancement upsells via 300+ QS100 professor/researcher network","marketing_channels":"Own website/app SEO (program-database content moat), 知乎 institutional column + 学员日记 series, 小红书, WeChat 公众号, offer 榜单; almost entirely owned media","marketing_notes":"The anti-Valeon playbook: product-led (database/app) acquisition converts DIY researchers into signed clients; content is program data + student diaries rather than founder persona — fully institutional brand. Claims 98% praise rate on 知乎/小红书. Some 黑猫 complaints exist (e.g. alleged exaggerated promises via 小红书 ads, one demanding 50% refund) but volume is low relative to scale.","marketing_budget_est":"est. RMB 10-25M/yr: large in-house content+IT team, 小红书/知乎 ops, modest paid — low confidence","positioning_en":"Transparent, mid-priced, all-full-time masters application factory for UK/HK/SG — published prices, contractual guarantees, and a program-database app that manufactures its own demand at 1M+ registered users.","positioning_zh":"英港新硕士申请的\"透明工厂\"：明码标价1.8-2.4万、全职三对一、退费条款写进合同，并靠116万注册用户的选校数据库App自造流量。","problems_en":"Low price ceiling caps service depth (no elite same-field mentor layer — the 3 staff are process professionals, not PhD peers); 88% 'Top-100' framing masks that volume skews to rankings-driven one-year UK/HK masters, not truly selective programs; Heimao complaints allege 小红书 advertising overpromised outcomes; scale model vulnerable to consultant caseload overload in peak season; almost no US/PhD capability — limited help for research-degree applicants.","problems_zh":"低客单价决定服务深度有限（三位老师是流程专业人员，缺少同领域名校PhD导师层）；\"88%进Top100\"的话术掩盖了生源集中在排名导向的英港一年硕，而非真正高选择性项目；黑猫有投诉称其小红书广告涉嫌夸大承诺；规模化模式在申请高峰期存在顾问带单过载风险；美国线和博士申请能力薄弱。","lessons_en":"Copy: (1) published transparent pricing + written guarantees is a massive trust weapon against an industry of opaque quotes; (2) a program database/content product that serves DIY researchers is the cheapest durable acquisition channel in this category; (3) all-full-time delivery kills the mentor-flakiness complaint class entirely. Avoid: letting transparency force you into the RMB 20k commodity tier — AcademiaOne should pair Compass-style transparency with a genuinely deeper (mentor/PhD) service to defend premium pricing.","lessons_zh":"可借鉴：(1)明码标价+书面保障条款，在报价黑箱的行业里是巨大的信任武器；(2)面向DIY人群的选校数据库/内容产品是本品类最便宜且最持久的获客渠道；(3)全职交付直接消灭\"导师失联\"这一整类投诉。需避免：透明化不等于降价——AcademiaOne应把指南者式的透明和更深的硕博导师服务结合，守住高客单价。","confidence":"medium","sources":"compassedu.hk, baike.baidu.com (指南者留学), zhuanlan.zhihu.com/p/2036451636982372229, tousu.sina.com.cn/complaint/view/17373999997, zhihu.com/question/460627836, wabei.cn/Home/News/359937, douban.com/note/868347636","category_key":"cn-premium","_founded":2012,"_team":450,"_fund":null,"_cn":true},{"name_en":"GGU (Global Gateway University / GGU Consulting)","name_zh":"世毕盟教育","country":"China","hq":"Beijing (Wudaokou/Haidian, next to Tsinghua/PKU); Shanghai office; historically claimed presence in 10+ cities","founded":"2009 (team formed; brand fully launched ~2011)","status":"active","ownership":"Private, founder-led (created by Tsinghua/Stanford/MIT/Harvard alumni team); no external VC rounds found on IT桔子","funding":"No disclosed funding; appears bootstrapped","investors":"None disclosed","valuation":"n/a","revenue_est":"est. RMB 30-80M/yr (several hundred high-ticket masters/PhD clients x RMB 60-120k) — low confidence","team_size":"est. 50-150 full-time plus large part-time mentor network; Beijing registered entity shows only ~15 social-insured employees (企查查/百度百科), suggesting lean core + contractor mentors","target_dest":"US-first, UK second (US/UK top programmes; some HK/SG)","segment":"Masters/PhD-first, elite-undergrad clientele (dominant share among Tsinghua/PKU/Fudan/SJTU applicants applying out for grad school)","pricing":"est. RMB 60k-120k per package; Zhihu/Douban threads commonly cite RMB 80k-100k for masters/PhD; no published price list","business_model":"\"Training + mentorship\" dual model: full-time in-house counselor (培训师) teaches application strategy, paired with a part-time mentor (名校在读PhD/校友) in the student's target field; founder (龚老师) personally leads school-selection sessions; sells strategy coaching rather than 代办 paperwork","marketing_channels":"Campus lectures/posters at Tsinghua/PKU, student campus ambassadors, alumni referral, WeChat 公众号 offer-list posts, Zhihu threads, success-story soft articles (e.g. 从清华到斯坦福)","marketing_notes":"Almost zero paid media; growth is ground-game penetration of C9 campuses (教学楼/宿舍 posters, 讲座 with freshmen/sophomores attending) plus 龚老师's personal authority — semi founder-led brand. No significant 小红书/抖音 machine found; follower counts not published. This makes it strong with 清北 students but nearly invisible to 双非/海本 masses","marketing_budget_est":"est. RMB 2-8M/yr: campus events + content + small team, negligible ad buying — low confidence","positioning_en":"The 'elite insiders club' for top-university students applying to US/UK grad school: strategy training and same-field PhD mentors, trading on dominance inside Tsinghua/PKU rather than mass advertising.","positioning_zh":"面向清北复交等顶尖学生的美英名校硕博申请\"圈内机构\"：以申请策略培训+同领域名校PhD mentor为核心卖点，靠在顶尖高校内部的口碑和讲座渗透，而非大众投放。","problems_en":"Notorious 1point3acres thread '血泪控诉世毕盟'; recurring complaints that mentors are unresponsive, give perfunctory 'good to go' feedback, and refuse meetings in peak season; consultants attentive pre-contract then cold after; quality varies wildly by assigned counselor; RMB 80k+ fees for what some describe as 'paying for peace of mind while doing DIY'; founder-gatekeeping (one person doing 选校) is a bottleneck and key-person risk; tiny insured headcount vs. premium price implies heavy reliance on part-time labor.","problems_zh":"一亩三分地有著名的\"血泪控诉世毕盟\"长帖；高频吐槽包括：mentor不闻不问、文书反馈只有一句\"good to go\"、申请季约不到人；签约前热情签约后冷淡；服务质量因人而异波动极大；8万+的价格被不少学员形容为\"花钱买心安、实际自己DIY\"；选校高度依赖龚老师一人，存在瓶颈和关键人风险；参保人数极少，重度依赖兼职mentor。","lessons_en":"Copy: owning a narrow beachhead (top campuses) with lectures + peer ambassadors builds a durable premium brand with near-zero ad spend; selling 'strategy training' justifies premium pricing. Avoid: part-time mentors without caseload caps and QC — mentor negligence is the single biggest complaint; a boutique must contractually guarantee mentor response times and audit feedback quality.","lessons_zh":"可借鉴：深耕一个窄而高端的滩头阵地（顶尖高校），用讲座+学生大使做零投放的口碑增长；卖\"申请策略训练\"支撑高客单价。需避免：兼职mentor无接单上限、无质检——mentor怠工是其最大投诉源；精品机构应在合同中承诺mentor响应时效并对反馈质量做抽检。","confidence":"medium","sources":"zhihu.com/question/47233949, zhihu.com/question/20910071, zhihu.com/question/312866310, 1point3acres.com/bbs/thread-192546, baike.baidu.com (北京世毕盟教育咨询服务有限公司), itjuzi.com/company/33983465, gguconsulting.com, douban.com/group/topic/105291758","category_key":"cn-premium","_founded":2009,"_team":100,"_fund":null,"_cn":true},{"name_en":"HiTure (Hechuang)","name_zh":"和创留学","country":"China","hq":"Beijing (北京和创兄弟教育咨询有限公司)","founded":"est. ~2013-2014 (Douban discussions by 2015; '创始团队13年咨询经验' claim)","status":"active","ownership":"Private founder-led; legal representative/leader 曹贤水 (per 百度百科)","funding":"None disclosed; bootstrapped","investors":"None disclosed","valuation":"n/a","revenue_est":"est. RMB 5-20M/yr — low confidence","team_size":"est. 20-80 (basis: single-city boutique, consultant-centric model claiming '人均主刀120个申请案例'); low confidence","target_dest":"US-first (graduate + undergraduate transfer specialty)","segment":"US Masters + UG-transfer boutique; coach-positioning","pricing":"Not published; est. RMB 30k-80k for US masters coaching packages — low confidence","business_model":"'申请好教练，不当托管好保姆' — coaching model: senior full-time consultants (avg 120 cases each) run strategy while students execute; proprietary application-management system for process visibility; claims Harvard/Yale/Stanford/Cambridge professor network for research guidance; published book 《你也能去美国留学》","marketing_channels":"知乎 (historically strong consultant-authored answers), WeChat 公众号, book publishing, 新浪教育盛典 award PR (2018 品牌影响力留学机构)","marketing_notes":"Founder/consultant-led professional brand (individual consultants' 知乎 authority) rather than institutional media machine; visibility has faded relative to 小红书-era competitors; no significant follower counts found on new platforms.","marketing_budget_est":"est. RMB 1-3M/yr: content + PR only — low confidence","positioning_en":"US-focused 'application coach' boutique: senior consultants with heavy case counts and a process-visibility system, explicitly rejecting the nanny/ghostwriting model.","positioning_zh":"美国线\"申请教练\"型精品机构：资深顾问人均百余案例、自研申请管理系统实现过程可视化，旗帜鲜明地反保姆式、反代写。","problems_en":"Brand reach largely trapped in 知乎 era — thin presence where 2025-26 demand actually browses (小红书); '120 cases per consultant' cuts both ways (experience vs. caseload overload); US-only focus is exposed to 2025-26 US visa/policy headwinds; small scale and key-person dependence; no published pricing or guarantees to counter bigger transparent players.","problems_zh":"品牌声量停留在知乎时代——在2025-26年需求真正聚集的小红书上存在感弱；\"人均主刀120案例\"是双刃剑（经验足但带单量存疑）；只做美国线，直面2025-26年美国签证与政策逆风；体量小、依赖关键人物；没有公开价格和保障条款，难与透明化的大机构正面竞争。","lessons_en":"Copy: 'coach not nanny' positioning language lands well with serious grad applicants — AcademiaOne's durable-business ethos rhymes with it; an application-progress system visible to clients is cheap to build and materially reduces anxiety-driven complaints. Avoid: single-country concentration and letting your content authority stay on yesterday's platform.","lessons_zh":"可借鉴：\"好教练不是好保姆\"的表达对认真做申请的研究生人群非常有效，与AcademiaOne想做长久生意的理念同频；对客户可见的申请进度系统开发成本低，却能显著减少焦虑型投诉。需避免：单一国家押注；内容阵地停在上一代平台不迁移。","confidence":"low","sources":"hechuangedu.com, baike.baidu.com/item/和创留学, douban.com/group/topic/79543603, hechuangedu.com/joinUs","category_key":"cn-premium","_founded":2013,"_team":50,"_fund":null,"_cn":true},{"name_en":"InVisor International Education","name_zh":"因未国际教育（InVisor留学）","country":"China","hq":"Guangzhou (Tianhe, 保利克洛维中景 B座)","founded":"2015","status":"active","ownership":"Private, bootstrapped; three co-founders (海归 returnees) who started it after their own bad agency experiences; name = 'Individualized Advisor'","funding":"None disclosed","investors":"None disclosed","valuation":"n/a","revenue_est":"est. RMB 2-8M/yr — low confidence","team_size":"est. 10-40 core staff (basis: single Guangzhou office, boutique volume — '200+ students into global Top-30 since 2015' implies ~dozens of clients/yr) plus a claimed cross-continent network of professors/AOs/alumni","target_dest":"UK/US/CA/AU/SG/HK — broad, masters-first plus PhD (硕博申请)","segment":"Masters/PhD-first boutique + background-enhancement engine (sub-brand InVisor学术科研 / tutorcamp.cn for research training and paper publication)","pricing":"Modular/semi-DIY options through full service; est. RMB 20k-60k full packages, smaller tickets for 科研/文书 modules — low confidence, not published (site even details 留位费 guidance content)","business_model":"Individualized-advisor boutique pairing application consulting with its own research-mentoring upsell (academic projects, journal publication coaching) — building the applicant's profile and then applying with it; long-tail content operation by major (e.g. program guides for niche fields like Gender Studies)","marketing_channels":"SEO long-tail program guides on invisor.cn, 知乎 Q&A, WeChat 公众号 (contact via personal WeChat invisor003 — high-touch funnel), 小红书 presence modest; student feedback pages","marketing_notes":"Institutional-but-intimate: the funnel deliberately lands on a personal WeChat conversation, matching its boutique promise. Content strategy = own the long tail of '<小众专业> 留学申请' searches that big players ignore. No meaningful follower counts found — reach is small.","marketing_budget_est":"est. <RMB 1M/yr: SEO content + organic social only — low confidence","positioning_en":"A young masters/PhD boutique founded 'by burned applicants, against bad agencies': individualized advising plus an in-house research-training arm that manufactures the applicant profile it then applies with.","positioning_zh":"由\"踩过坑的申请人\"创立的年轻硕博精品机构：个性化导师式咨询，加上自营的学术科研训练线——先做背景，再拿背景去申请。","problems_en":"Tiny scale and near-zero brand awareness outside its long-tail SEO catchment; the paid-research/publication (付费科研) category it upsells faces industry-wide credibility criticism — admissions committees increasingly discount purchased research; key-person dependence; no published pricing/guarantees; growth ceiling without capital or a repeatable social channel.","problems_zh":"体量极小，长尾SEO覆盖之外几乎没有品牌认知；其主推的付费科研/论文发表品类正遭遇全行业的信誉质疑——招生委员会对\"买来的科研\"越来越打折扣；依赖关键人物；无公开价格与保障条款；没有资本或可复制的社交渠道，增长有天花板。","lessons_en":"Copy: long-tail program-level content ('how to apply for X niche masters') wins high-intent grad applicants at near-zero CAC — ideal for a boutique's first 100 clients; landing the funnel on a personal conversation fits premium positioning. Avoid:
