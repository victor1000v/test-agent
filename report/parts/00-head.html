<title>The Masters Market Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Archivo:ital,wght@0,400..700;1,400..700&display=swap">
<style>
:root{
  --paper:#F5F0E4; --panel:#FBF8F1; --wash:#EFE8D3; --wash-2:#E9E0c9;
  --ink:#211C11; --ink-2:#5E5540; --ink-3:#8C8168;
  --line:#E3DAC4; --line-2:#CFC3A4;
  --gold:#A87B24; --gold-ink:#7A5A1B; --gold-soft:#C9A968;
  --oxblood:#8E2F1F; --oxblood-soft:#F3E2DC;
  --good:#3D6B1F;
  --s1:#2F63C1; --s2:#A87B24; --s3:#0B8A6E; --s4:#C74436; --s5:#8A4FA3; --s6:#6B8A22;
  --serif:"Newsreader","Noto Serif SC",Georgia,"Songti SC",serif;
  --cjk:"Noto Serif SC","Newsreader",Georgia,"Songti SC",serif;
  --sans:"Archivo","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --rail-w:248px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body.zh{font-family:var(--cjk); line-height:1.9; font-size:16.5px}
body.zh .en{display:none !important}
body:not(.zh) .zh{display:none !important}
::selection{background:var(--gold-soft); color:var(--ink)}

/* ---------- structure ---------- */
.rail{
  position:fixed; top:0; left:0; bottom:0; width:var(--rail-w);
  background:var(--paper); border-right:1px solid var(--line);
  padding:28px 20px 28px 24px; overflow-y:auto; z-index:40;
  scrollbar-width:thin; scrollbar-color:var(--line-2) transparent;
}
.rail .brand{font-family:var(--sans); font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink)}
.rail .brand em{color:var(--gold-ink); font-style:normal}
.rail .brand-sub{font-family:var(--sans); font-size:10.5px; letter-spacing:.1em; color:var(--ink-3); margin-top:4px; text-transform:uppercase}
.rail nav{margin-top:26px}
.rail a{
  display:flex; gap:10px; align-items:baseline; text-decoration:none;
  padding:5.5px 8px 5.5px 6px; margin:0 -8px 0 -6px; border-radius:3px;
  color:var(--ink-2); font-family:var(--sans); font-size:12.5px; line-height:1.35;
}
body.zh .rail a{font-family:var(--cjk); font-size:13px}
.rail a .n{font-family:var(--sans); font-size:10px; color:var(--ink-3); min-width:18px; font-variant-numeric:tabular-nums; letter-spacing:.05em}
.rail a:hover{background:var(--wash); color:var(--ink)}
.rail a.on{color:var(--gold-ink); background:var(--wash)}
.rail a.on .n{color:var(--gold-ink)}
.rail .part-label{font-family:var(--sans); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin:18px 0 6px; border-top:1px solid var(--line); padding-top:12px}
.rail .part-label:first-child{border-top:none; margin-top:0}

main{margin-left:var(--rail-w); padding:0 48px 120px}
.sheet{max-width:1120px; margin:0 auto}
.prose{max-width:720px}
body.zh .prose{max-width:760px}
.wide{max-width:1120px}

/* language toggle */
.langbar{
  position:fixed; top:16px; right:20px; z-index:60; display:flex; gap:0;
  border:1px solid var(--line-2); border-radius:99px; background:var(--panel);
  box-shadow:0 2px 10px rgba(33,28,17,.07); overflow:hidden;
}
.langbar button{
  font-family:var(--sans); font-size:12px; letter-spacing:.06em; padding:7px 14px;
  background:transparent; color:var(--ink-2); border:0; cursor:pointer;
}
.langbar button.on{background:var(--ink); color:var(--paper)}

/* ---------- typography ---------- */
.eyebrow{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-ink)}
body.zh .eyebrow{letter-spacing:.32em; font-family:var(--cjk); font-weight:600}
h1{font-family:var(--serif); font-optical-sizing:auto; font-weight:400; font-size:clamp(42px,5.4vw,68px); line-height:1.06; letter-spacing:-.01em; text-wrap:balance}
body.zh h1{font-family:var(--cjk); font-weight:500; line-height:1.22}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(28px,3vw,38px); line-height:1.15; letter-spacing:-.005em; text-wrap:balance}
body.zh h2{font-family:var(--cjk); font-weight:500; line-height:1.35}
h3{font-family:var(--serif); font-weight:500; font-size:22px; line-height:1.3; text-wrap:balance}
body.zh h3{font-family:var(--cjk)}
h4{font-family:var(--sans); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2)}
body.zh h4{font-family:var(--cjk); letter-spacing:.2em}
p{margin:0 0 1.1em}
.lede{font-size:20.5px; line-height:1.55; color:var(--ink); font-weight:400}
body.zh .lede{font-size:19px; line-height:1.8}
a{color:var(--gold-ink)}
strong{font-weight:600}
em.term{font-style:normal; border-bottom:2px solid var(--gold-soft)}
.small{font-family:var(--sans); font-size:12.5px; color:var(--ink-2); line-height:1.55}
.num{font-variant-numeric:tabular-nums}

/* section scaffolding */
section.ch{padding:88px 0 8px; border-top:1px solid var(--line); margin-top:72px}
section.ch:first-of-type{border-top:none; margin-top:0}
.ch-head{margin-bottom:34px; max-width:820px}
.ch-head .ch-no{font-family:var(--sans); font-size:11px; letter-spacing:.2em; color:var(--ink-3); margin-bottom:14px; text-transform:uppercase}
.ch-head .ch-no b{color:var(--gold-ink); font-weight:700}
.ch-head h2{margin:10px 0 14px}
.ch-head .dek{font-size:19px; line-height:1.55; color:var(--ink-2); max-width:66ch}
body.zh .ch-head .dek{font-size:17px; line-height:1.85}
.gold-rule{width:52px; height:3px; background:var(--gold); border:0; margin:18px 0 0}

/* callouts, figures, cards */
.callout{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--gold); padding:20px 24px; margin:28px 0; border-radius:2px}
.callout.warn{border-left-color:var(--oxblood); background:var(--oxblood-soft)}
.callout .small{margin-bottom:0}
.figure{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:22px 22px 16px; margin:30px 0}
.figure .fig-title{font-family:var(--sans); font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:2px}
body.zh .figure .fig-title{font-family:var(--cjk)}
.figure .fig-sub{font-family:var(--sans); font-size:11.5px; color:var(--ink-3); margin-bottom:14px}
body.zh .figure .fig-sub{font-family:var(--cjk)}
.figure .fig-note{font-family:var(--sans); font-size:11px; color:var(--ink-3); margin-top:10px; border-top:1px solid var(--line); padding-top:10px; line-height:1.5}
body.zh .figure .fig-note{font-family:var(--cjk)}
.figure svg{display:block; max-width:100%; height:auto}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
@media(max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:560px){.grid3,.grid4{grid-template-columns:1fr}}

.stat{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:18px 20px 16px}
.stat .v{font-family:var(--serif); font-size:40px; line-height:1; letter-spacing:-.01em; color:var(--ink)}
.stat .v small{font-size:20px; color:var(--ink-2)}
.stat .k{font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:9px; line-height:1.45}
body.zh .stat .k{font-family:var(--cjk); letter-spacing:.15em}
.stat .s{font-family:var(--sans); font-size:11px; color:var(--ink-2); margin-top:5px; line-height:1.45}
body.zh .stat .s{font-family:var(--cjk)}
.stat.gold{background:var(--ink); border-color:var(--ink)}
.stat.gold .v{color:var(--gold-soft)}
.stat.gold .k{color:#B9AE93}
.stat.gold .s{color:#8C8168}

/* chips & pills */
.chip{display:inline-block; font-family:var(--sans); font-size:11px; font-weight:600; letter-spacing:.04em; padding:3px 9px; border-radius:99px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--panel); white-space:nowrap}
body.zh .chip{font-family:var(--cjk)}
.chip.c-high{border-color:#B7CBA0; color:var(--good); background:#EFF3E4}
.chip.c-medium{border-color:var(--gold-soft); color:var(--gold-ink); background:#F6EEDA}
.chip.c-low{border-color:var(--line-2); color:var(--ink-3); background:var(--wash)}
.chip.st-defunct,.chip.st-troubled{border-color:#D9B3A8; color:var(--oxblood); background:var(--oxblood-soft)}
.chip.st-acquired,.chip.st-pivoted{border-color:#A8BBD9; color:#2C4A77; background:#E7EDF5}

.tag-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:baseline}

/* reveal animation */
.rv{opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease}
.rv.in{opacity:1; transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1; transform:none; transition:none}}

/* tooltip */
#tip{
  position:fixed; z-index:99; pointer-events:none; display:none; max-width:300px;
  background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:12px; line-height:1.5;
  padding:8px 11px; border-radius:4px; box-shadow:0 6px 18px rgba(33,28,17,.25);
}
#tip b{color:var(--gold-soft)}
#tip .zh,#tip .en{display:inline}

/* generic data table */
table.dt{width:100%; border-collapse:collapse; font-family:var(--sans); font-size:13px}
body.zh table.dt{font-family:var(--cjk)}
table.dt th{
  text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:2px solid var(--line-2); padding:8px 12px 8px 0; white-space:nowrap;
}
table.dt td{border-bottom:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; line-height:1.5}
table.dt tr:last-child td{border-bottom:none}
table.dt td.num,table.dt th.num{text-align:right; font-variant-numeric:tabular-nums}

/* mobile */
.mob-nav{display:none}
@media(max-width:1080px){
  .rail{display:none}
  main{margin-left:0; padding:0 22px 90px}
  .mob-nav{
    display:flex; gap:8px; overflow-x:auto; position:sticky; top:0; z-index:30;
    background:var(--paper); border-bottom:1px solid var(--line); padding:12px 4px; margin:0 -22px 0; padding-left:22px;
    scrollbar-width:none;
  }
  .mob-nav a{flex:0 0 auto; text-decoration:none; font-family:var(--sans); font-size:11.5px; color:var(--ink-2); border:1px solid var(--line-2); padding:5px 11px; border-radius:99px; background:var(--panel)}
  .langbar{top:60px}
}

/* print */
@media print{
  .rail,.langbar,.mob-nav,#tip{display:none !important}
  main{margin-left:0; padding:0}
  section.ch{page-break-before:always; padding-top:24px; margin-top:0}
  body{font-size:12.5px}
  .figure,.callout,.stat{break-inside:avoid}
}
</style>
