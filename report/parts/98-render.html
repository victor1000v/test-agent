<style>
/* ---------- company database ---------- */
#db-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:18px 0 14px; font-family:var(--sans)}
#db-controls input[type=search]{
  flex:1 1 240px; min-width:200px; font-family:var(--sans); font-size:13.5px; color:var(--ink);
  padding:9px 14px; border:1px solid var(--line-2); border-radius:99px; background:var(--panel); outline:none;
}
#db-controls input[type=search]:focus{border-color:var(--gold)}
#db-controls select{
  font-family:var(--sans); font-size:12.5px; color:var(--ink-2); padding:8px 10px;
  border:1px solid var(--line-2); border-radius:6px; background:var(--panel); outline:none; max-width:230px;
}
#db-count{font-size:12px; color:var(--ink-3); white-space:nowrap}
#db-cats{display:flex; gap:7px; flex-wrap:wrap; margin:0 0 16px}
#db-cats button{
  font-family:var(--sans); font-size:11.5px; padding:5px 11px; border-radius:99px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--panel); color:var(--ink-2);
}
body.zh #db-cats button{font-family:var(--cjk)}
#db-cats button.on{background:var(--ink); border-color:var(--ink); color:var(--paper)}
#db-table-wrap{border:1px solid var(--line); border-radius:3px; background:var(--panel); overflow:hidden}
#db-table{width:100%; border-collapse:collapse; font-family:var(--sans); font-size:13px}
body.zh #db-table{font-family:var(--cjk)}
#db-table th{
  position:sticky; top:0; background:var(--wash); z-index:5; text-align:left; cursor:pointer; user-select:none;
  font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
  padding:10px 12px; border-bottom:2px solid var(--line-2); white-space:nowrap;
}
#db-table th .arr{color:var(--gold-ink); font-size:10px}
#db-table td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
#db-table tr.row{cursor:pointer}
#db-table tr.row:hover td{background:#F6F0DF}
#db-table tr.row.open td{background:#F3ECD9; border-bottom-color:transparent}
#db-table .co-name{font-weight:600; color:var(--ink); font-size:13.5px}
#db-table .co-zh{color:var(--ink-3); font-size:12px; margin-top:1px}
#db-table td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
tr.detail td{background:#FBF7EC; border-bottom:1px solid var(--line-2); padding:20px 22px 22px}
.det-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 28px}
@media(max-width:820px){.det-grid{grid-template-columns:1fr}}
.det-item .dk{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:4px}
body.zh .det-item .dk{font-family:var(--cjk); letter-spacing:.2em}
.det-item .dv{font-size:13px; line-height:1.6; color:var(--ink)}
.det-item .dv.warn{color:var(--oxblood)}
.det-src{grid-column:1/-1; font-family:var(--sans); font-size:11px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:10px; line-height:1.6; word-break:break-all}
</style>
<script>
/* ===== company database table ===== */
var DB = { q:'', cat:'all', region:'all', status:'all', sort:'cat', dir:1, open:{} };
var CATS = {}; /* filled from DATA.cats */

function parseNumField(v){ return (v == null || isNaN(v)) ? null : Number(v); }

function coStatusChip(c){
  var st = (c.status || '').toLowerCase();
  var key = st.indexOf('defunct') >= 0 || st.indexOf('collapse') >= 0 ? 'defunct'
    : st.indexOf('troubl') >= 0 || st.indexOf('crisis') >= 0 || st.indexOf('declin') >= 0 ? 'troubled'
    : st.indexOf('acquir') >= 0 ? 'acquired'
    : st.indexOf('pivot') >= 0 ? 'pivoted' : 'active';
  var lbl = {defunct:['defunct','已倒闭'], troubled:['troubled','陷入困境'], acquired:['acquired','被收购'], pivoted:['pivoted','已转型'], active:['active','运营中']}[key];
  return '<span class="chip st-' + key + '">' + esc(L(lbl[0], lbl[1])) + '</span>';
}
function confChip(c){
  var lbl = {high:['high','高'], medium:['med','中'], low:['est.','估']}[c.confidence] || ['est.','估'];
  return '<span class="chip c-' + (c.confidence || 'low') + '">' + esc(L(lbl[0], lbl[1])) + '</span>';
}
function catName(k){ var c = CATS[k]; return c ? L(c.en, c.zh) : k; }

function dbFiltered(){
  var q = DB.q.toLowerCase();
  var rows = DATA.companies.filter(function(c){
    if (DB.cat !== 'all' && c.category_key !== DB.cat) return false;
    if (DB.region === 'cn' && !c._cn) return false;
    if (DB.region === 'intl' && c._cn) return false;
    if (DB.status !== 'all'){
      var st = (c.status || '').toLowerCase();
      var bad = /defunct|collapse|troubl|crisis|declin|pivot/.test(st);
      if (DB.status === 'active' && bad) return false;
      if (DB.status === 'issues' && !bad) return false;
    }
    if (q){
      var hay = (c.name_en + ' ' + (c.name_zh||'') + ' ' + (c.hq||'') + ' ' + (c.country||'') + ' ' + (c.positioning_en||'') + ' ' + (c.positioning_zh||'') + ' ' + (c.business_model||'')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  var s = DB.sort, d = DB.dir;
  rows.sort(function(a, b){
    function nn(v){ return v == null ? (d > 0 ? 1e12 : -1e12) : v; }
    if (s === 'name') return d * a.name_en.localeCompare(b.name_en);
    if (s === 'founded') return d * (nn(a._founded) - nn(b._founded));
    if (s === 'team') return d * (nn(a._team) - nn(b._team));
    if (s === 'fund') return d * (nn(a._fund) - nn(b._fund));
    return a.category_key === b.category_key ? a.name_en.localeCompare(b.name_en) : (a._catOrder - b._catOrder);
  });
  return rows;
}

function detRow(c){
  function item(kEn, kZh, v, cls){
    if (!v) return '';
    return '<div class="det-item"><div class="dk">' + esc(L(kEn, kZh)) + '</div><div class="dv' + (cls ? ' ' + cls : '') + '">' + esc(v) + '</div></div>';
  }
  var pos = L(c.positioning_en, c.positioning_zh), prob = L(c.problems_en, c.problems_zh), les = L(c.lessons_en, c.lessons_zh);
  return '<tr class="detail"><td colspan="8"><div class="det-grid">'
    + item('Positioning', '定位', pos)
    + item('Business model', '商业模式', c.business_model)
    + item('Segment & destinations', '业务构成与目的地', (c.segment || '') + (c.target_dest ? ' · ' + c.target_dest : ''))
    + item('Pricing', '价格', c.pricing)
    + item('Ownership & funding', '股权与融资', [c.ownership, c.funding, c.valuation ? 'Valuation: ' + c.valuation : ''].filter(Boolean).join(' · '))
    + item('Investors', '投资方', c.investors)
    + item('Team', '团队规模', c.team_size)
    + item('Revenue signal', '收入信号', c.revenue_est)
    + item('Marketing channels', '营销渠道', c.marketing_channels)
    + item('Marketing notes (2025–26)', '营销打法（2025–26）', c.marketing_notes)
    + item('Est. marketing budget', '预估营销预算', c.marketing_budget_est)
    + item('Problems & complaints', '问题与投诉', prob, 'warn')
    + '<div class="det-item" style="grid-column:1/-1"><div class="dk">' + esc(L('Lessons for AcademiaOne', '对 AcademiaOne 的启示')) + '</div><div class="dv" style="border-left:3px solid var(--gold); padding-left:12px">' + esc(les) + '</div></div>'
    + (c.sources ? '<div class="det-src">' + esc(L('Sources: ', '来源：')) + esc(c.sources) + '</div>' : '')
    + '</div></td></tr>';
}

function renderDB(){
  var host = document.getElementById('db-body'); if (!host) return;
  var rows = dbFiltered();
  var cnt = document.getElementById('db-count');
  if (cnt) cnt.textContent = L('Showing ' + rows.length + ' of ' + DATA.companies.length + ' companies', '显示 ' + rows.length + ' / ' + DATA.companies.length + ' 家公司');
  var h = '';
  rows.forEach(function(c){
    var open = DB.open[c.id];
    h += '<tr class="row' + (open ? ' open' : '') + '" data-id="' + c.id + '">'
      + '<td><div class="co-name">' + esc(c.name_en) + '</div>' + (c.name_zh ? '<div class="co-zh">' + esc(c.name_zh) + '</div>' : '') + '</td>'
      + '<td><span class="chip">' + esc(catName(c.category_key)) + '</span></td>'
      + '<td class="small">' + esc(c.country || '—') + '</td>'
      + '<td class="num">' + esc(c._founded || c.founded || '—') + '</td>'
      + '<td class="num" ' + (c.team_size ? 'data-tip="' + esc(esc(c.team_size)) + '"' : '') + '>' + esc(c._team != null ? '~' + fmtN(c._team) : '—') + '</td>'
      + '<td class="num" ' + (c.funding ? 'data-tip="' + esc(esc(c.funding)) + '"' : '') + '>' + (c._fund != null ? '$' + fmtN(c._fund) + 'M' : (/bootstrap|self|无融资|未融资/i.test(c.ownership||'') ? esc(L('none','无')) : '—')) + '</td>'
      + '<td>' + coStatusChip(c) + '</td>'
      + '<td>' + confChip(c) + '</td>'
      + '</tr>';
    if (open) h += detRow(c);
  });
  host.innerHTML = h || '<tr><td colspan="8" class="small" style="padding:24px">' + esc(L('No companies match.', '没有符合条件的公司。')) + '</td></tr>';
}

function initDB(){
  var host = document.getElementById('ch05-db'); if (!host) return;
  DATA.cats.forEach(function(c, i){ CATS[c.key] = c; });
  DATA.companies.forEach(function(c, i){
    c.id = 'co' + i;
    c._catOrder = DATA.cats.findIndex(function(x){ return x.key === c.category_key; });
  });
  var catBtns = '<button class="on" data-cat="all"><span class="en">All</span><span class="zh">全部</span></button>'
    + DATA.cats.map(function(c){
        var n = DATA.companies.filter(function(x){ return x.category_key === c.key; }).length;
        return '<button data-cat="' + c.key + '"><span class="en">' + esc(c.en) + '</span><span class="zh">' + esc(c.zh) + '</span> · ' + n + '</button>';
      }).join('');
  host.innerHTML =
    '<div id="db-controls">'
    + '<input type="search" id="db-q" placeholder="">'
    + '<select id="db-region"></select><select id="db-status"></select>'
    + '<span id="db-count"></span></div>'
    + '<div id="db-cats">' + catBtns + '</div>'
    + '<div id="db-table-wrap" class="scrollx"><table id="db-table"><thead><tr>'
    + '<th data-s="name"></th><th data-s="cat"></th><th data-s="hq"></th>'
    + '<th data-s="founded" class="num"></th><th data-s="team" class="num"></th><th data-s="fund" class="num"></th>'
    + '<th></th><th></th>'
    + '</tr></thead><tbody id="db-body"></tbody></table></div>';

  function chrome(){
    document.getElementById('db-q').placeholder = L('Search 130+ companies… (name, 中文名, positioning)', '搜索 130+ 家公司…（名称 / 定位 / 城市）');
    var rg = document.getElementById('db-region');
    rg.innerHTML = '<option value="all">' + esc(L('All regions','全部地区')) + '</option><option value="cn">' + esc(L('China-founded','中国系')) + '</option><option value="intl">' + esc(L('International','国际系')) + '</option>';
    rg.value = DB.region;
    var stq = document.getElementById('db-status');
    stq.innerHTML = '<option value="all">' + esc(L('All statuses','全部状态')) + '</option><option value="active">' + esc(L('Active & healthy','运营正常')) + '</option><option value="issues">' + esc(L('Troubled / defunct / pivoted','困境 / 倒闭 / 转型')) + '</option>';
    stq.value = DB.status;
    var ths = document.querySelectorAll('#db-table th');
    var labels = [['Company','公司'], ['Category','类型'], ['HQ','总部'], ['Founded','成立'], ['Team (est.)','团队(估)'], ['Raised','融资'], ['Status','状态'], ['Data','数据']];
    ths.forEach(function(th, i){
      var l = labels[i]; if (!l) return;
      var arr = th.dataset.s && th.dataset.s === DB.sort ? ' <span class="arr">' + (DB.dir > 0 ? '▲' : '▼') + '</span>' : '';
      th.innerHTML = esc(L(l[0], l[1])) + arr;
    });
  }
  document.getElementById('db-q').addEventListener('input', function(e){ DB.q = e.target.value; renderDB(); });
  document.getElementById('db-region').addEventListener('change', function(e){ DB.region = e.target.value; renderDB(); });
  document.getElementById('db-status').addEventListener('change', function(e){ DB.status = e.target.value; renderDB(); });
  document.getElementById('db-cats').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    DB.cat = b.dataset.cat;
    document.querySelectorAll('#db-cats button').forEach(function(x){ x.classList.toggle('on', x === b); });
    renderDB();
  });
  document.querySelector('#db-table thead').addEventListener('click', function(e){
    var th = e.target.closest('th'); if (!th || !th.dataset.s) return;
    if (DB.sort === th.dataset.s) DB.dir = -DB.dir; else { DB.sort = th.dataset.s; DB.dir = 1; }
    chrome(); renderDB();
  });
  document.getElementById('db-body').addEventListener('click', function(e){
    if (e.target.closest('a')) return;
    var tr = e.target.closest('tr.row'); if (!tr) return;
    DB.open[tr.dataset.id] = !DB.open[tr.dataset.id];
    renderDB();
  });
  __renders.push(function(){ chrome(); renderDB(); });
  chrome(); renderDB();
}

/* cover stats */
function initCover(){
  var el = document.getElementById('cover-stats'); if (!el) return;
  function render(){
    var n = DATA.companies.length;
    var cn = DATA.companies.filter(function(c){ return c._cn; }).length;
    var stats = [
      {v:n, k:L('companies profiled','家公司深度画像'), s:L(cn + ' China-founded · ' + (n - cn) + ' international', '中国系 ' + cn + ' 家 · 国际系 ' + (n - cn) + ' 家')},
      {v:DATA.cats.length, k:L('competitive archetypes','大竞争类型'), s:L('from mega-agency to MBA boutique','从传统大所到 MBA 精品咨询')},
      {v:DATA.meta.sources, k:L('sources consulted','个信息来源'), s:L('funding DBs, hiring platforms, complaints, filings','融资库 · 招聘平台 · 投诉平台 · 披露文件'), suf:'+'},
      {v:DATA.meta.failures, k:L('failure cases dissected','个失败案例复盘'), s:L('so AcademiaOne repeats none of them','让 AcademiaOne 一个都不重蹈')}
    ];
    el.innerHTML = stats.map(function(s, i){
      return '<div class="stat' + (i === 0 ? ' gold' : '') + '"><div class="v num countup done" data-to="' + s.v + '">' + fmtN(s.v) + (s.suf || '') + '</div><div class="k">' + esc(s.k) + '</div><div class="s">' + esc(s.s) + '</div></div>';
    }).join('');
  }
  __renders.push(render); render();
}

window.__buildAll = function(){
  initCover();
  initDB();
  if (window.buildCharts) buildCharts();
};
</script>
