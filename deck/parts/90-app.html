<script>
/* ===== language + tooltip + chart kit ===== */
var LANG = 'en';
try { LANG = localStorage.getItem('ao-deck-lang') || 'en'; } catch(e){}
var __renders = [];
function L(en, zh){ return LANG === 'zh' ? (zh || en) : en; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtN(n){ return Number(n).toLocaleString('en-US'); }
function setLang(l){
  LANG = l;
  document.body.classList.toggle('zh', l === 'zh');
  document.querySelectorAll('#langbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === l); });
  try { localStorage.setItem('ao-deck-lang', l); } catch(e){}
  __renders.forEach(function(fn){ try { fn(); } catch(e){ console.error(e); } });
}
document.querySelectorAll('#langbar button').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.dataset.l); }); });

(function(){
  var tip = document.getElementById('tip');
  function move(ev){
    var x = ev.clientX + 14, y = ev.clientY + 14, r = tip.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 12;
    if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('mouseover', function(ev){
    var t = ev.target.closest('[data-tip]');
    if (t){ tip.innerHTML = t.getAttribute('data-tip'); tip.style.display = 'block'; move(ev); }
    else if (!ev.target.closest('#tip')) tip.style.display = 'none';
  });
  document.addEventListener('mousemove', function(ev){ if (tip.style.display === 'block') move(ev); });
})();

var CH = { ink:'#211C11', ink2:'#5E5540', ink3:'#8C8168', grid:'#E9E1CC', axis:'#CFC3A4', panel:'#FBF8F1',
  gold:'#A87B24', blue:'#2F63C1', teal:'#0B8A6E', red:'#C74436', goldsoft:'#C9A968' };
function svgOpen(w, h){ return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" style="font-family:var(--sans)">'; }

function vbars(elId, labels, values, opts){
  opts = opts || {};
  function render(){
    var el = document.getElementById(elId); if (!el) return;
    var W = opts.w || 920, H = opts.h || 300, padL = 46, padB = 30, padT = 16, padR = 8;
    var pw = W - padL - padR, ph = H - padT - padB;
    var max = opts.max || Math.max.apply(null, values) * 1.12;
    var s = svgOpen(W, H);
    for (var t = 0; t <= 4; t++){
      var yv = max / 4 * t, y = padT + ph - yv / max * ph;
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="' + (t === 0 ? CH.axis : CH.grid) + '"/>';
      s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="' + CH.ink3 + '">' + (opts.fmt ? opts.fmt(yv) : Math.round(yv)) + '</text>';
    }
    var slot = pw / values.length, bw = Math.min(slot * 0.55, 90);
    values.forEach(function(v, i){
      var cx = padL + slot * i + slot / 2, bh = Math.max(2, v / max * ph);
      var lb = labels[i], lbl = L(lb.en, lb.zh);
      var tipS = '<b>' + esc(lbl) + '</b><br>' + esc(opts.fmt ? opts.fmt(v) : v) + (lb.note ? '<br>' + esc(L(lb.note, lb.noteZh || lb.note)) : '');
      s += '<rect data-tip="' + esc(tipS) + '" x="' + (cx - bw/2) + '" y="' + (padT + ph - bh) + '" width="' + bw + '" height="' + bh + '" rx="3" fill="' + (lb.color || CH.gold) + '"/>';
      s += '<text x="' + cx + '" y="' + (padT + ph - bh - 8) + '" text-anchor="middle" font-size="12.5" font-weight="600" fill="' + CH.ink2 + '">' + (opts.fmt ? opts.fmt(v) : v) + '</text>';
      s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11.5" fill="' + CH.ink3 + '">' + esc(lbl) + '</text>';
      if (lb.sub) s += '<text x="' + cx + '" y="' + (padT + ph - bh - 24) + '" text-anchor="middle" font-size="10.5" fill="' + CH.ink3 + '">' + esc(L(lb.sub, lb.subZh || lb.sub)) + '</text>';
    });
    el.innerHTML = s + '</svg>';
  }
  __renders.push(render); render();
}

function lineChart(elId, x, series, opts){
  opts = opts || {};
  function render(){
    var el = document.getElementById(elId); if (!el) return;
    var W = opts.w || 980, H = opts.h || 320, padL = 48, padB = 28, padT = 12, padR = opts.padR || 140;
    var pw = W - padL - padR, ph = H - padT - padB;
    var all = []; series.forEach(function(sr){ sr.values.forEach(function(v){ if (v != null) all.push(v); }); });
    var max = opts.max || Math.max.apply(null, all) * 1.1;
    function X(i){ return padL + pw * i / (x.length - 1); }
    function Y(v){ return padT + ph - v / max * ph; }
    var s = svgOpen(W, H);
    for (var t = 0; t <= 4; t++){
      var yv = max / 4 * t, y = Y(yv);
      s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR + 18) + '" y2="' + y + '" stroke="' + (t === 0 ? CH.axis : CH.grid) + '"/>';
      s += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="' + CH.ink3 + '">' + (opts.fmt ? opts.fmt(yv) : Math.round(yv)) + '</text>';
    }
    x.forEach(function(xl, i){ s += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + CH.ink3 + '">' + esc(xl) + '</text>'; });
    series.forEach(function(sr){
      var d = '', started = false;
      sr.values.forEach(function(v, i){ if (v == null) return; d += (started ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; started = true; });
      s += '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
      var li = sr.values.length - 1; while (li >= 0 && sr.values[li] == null) li--;
      s += '<circle cx="' + X(li) + '" cy="' + Y(sr.values[li]) + '" r="4" fill="' + sr.color + '" stroke="' + CH.panel + '" stroke-width="1.6"/>';
      s += '<text x="' + (X(li) + 10) + '" y="' + (Y(sr.values[li]) + 4 + (sr.dy || 0)) + '" font-size="12.5" font-weight="600" fill="' + sr.color + '">' + esc(L(sr.en, sr.zh)) + '</text>';
      sr.values.forEach(function(v, i){
        if (v == null) return;
        s += '<circle data-tip="' + esc('<b>' + esc(L(sr.en, sr.zh)) + '</b> · ' + esc(x[i]) + '<br>' + (opts.fmt ? opts.fmt(v) : v)) + '" cx="' + X(i) + '" cy="' + Y(v) + '" r="10" fill="transparent"/>';
      });
    });
    el.innerHTML = s + '</svg>';
  }
  __renders.push(render); render();
}

function rangeChart(elId, rows, opts){
  opts = opts || {};
  function render(){
    var el = document.getElementById(elId); if (!el) return;
    var max = opts.max, lw = opts.labelW || 210, bh = 22, gap = 12;
    var W = opts.w || 980, H = rows.length * (bh + gap) + 28;
    var bw = W - lw - 24;
    function X(v){ return lw + v / max * bw; }
    var s = svgOpen(W, H);
    if (opts.zone){ s += '<rect x="' + X(opts.zone[0]) + '" y="0" width="' + (X(opts.zone[1]) - X(opts.zone[0])) + '" height="' + (H - 24) + '" fill="' + CH.goldsoft + '" fill-opacity="0.22"/>';
      s += '<text x="' + ((X(opts.zone[0]) + X(opts.zone[1])) / 2) + '" y="14" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1" fill="' + CH.gold + '">' + esc(L(opts.zoneLbl || '', opts.zoneLblZh || opts.zoneLbl || '')) + '</text>'; }
    (opts.ticks || []).forEach(function(t){
      s += '<line x1="' + X(t) + '" y1="0" x2="' + X(t) + '" y2="' + (H - 24) + '" stroke="' + CH.grid + '"/>';
      s += '<text x="' + X(t) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="' + CH.ink3 + '">' + (opts.fmt ? opts.fmt(t) : t) + '</text>';
    });
    rows.forEach(function(r, i){
      var y = i * (bh + gap) + 20;
      var x0 = X(r.lo), x1 = Math.max(X(r.hi), X(r.lo) + 3);
      var tipS = '<b>' + esc(L(r.en, r.zh)) + '</b><br>' + esc((opts.fmt ? opts.fmt(r.lo) : r.lo) + ' – ' + (opts.fmt ? opts.fmt(r.hi) : r.hi)) + (r.note ? '<br>' + esc(L(r.note, r.noteZh || r.note)) : '');
      s += '<g data-tip="' + esc(tipS) + '">';
      s += '<rect x="0" y="' + (y - 4) + '" width="' + W + '" height="' + (bh + 8) + '" fill="transparent"/>';
      s += '<text x="' + (lw - 10) + '" y="' + (y + bh/2 + 4) + '" text-anchor="end" font-size="12.5" fill="' + (r.muted ? CH.ink3 : CH.ink2) + '">' + esc(L(r.en, r.zh)) + '</text>';
      s += '<line x1="' + lw + '" y1="' + (y + bh/2) + '" x2="' + (W - 8) + '" y2="' + (y + bh/2) + '" stroke="' + CH.grid + '"/>';
      s += '<rect x="' + x0 + '" y="' + y + '" width="' + (x1 - x0) + '" height="' + bh + '" rx="3" fill="' + (r.color || CH.gold) + '"' + (r.muted ? ' opacity="0.45"' : ' fill-opacity="0.88"') + '/>';
      var lbl = (opts.fmt ? opts.fmt(r.lo) : r.lo) + '–' + (opts.fmt ? opts.fmt(r.hi) : r.hi);
      if (x1 > W - 96) s += '<text x="' + (x1 - 8) + '" y="' + (y + bh/2 + 4) + '" text-anchor="end" font-size="11" fill="' + CH.panel + '">' + lbl + '</text>';
      else s += '<text x="' + (x1 + 7) + '" y="' + (y + bh/2 + 4) + '" font-size="11" fill="' + CH.ink2 + '">' + lbl + '</text>';
      s += '</g>';
    });
    el.innerHTML = s + '</svg>';
  }
  __renders.push(render); render();
}

    {en:'抖音 livestream funnel', zh:'抖音直播漏斗', lo:3000, hi:8000, color:CH.red, note:'telesales close 5–15%', noteZh:'电销签约 5–15%'},
    {en:'Baidu SEM', zh:'百度 SEM', lo:5000, hi:15000, color:CH.red, note:'head keywords ¥100–300+/click', noteZh:'头部词点击 100–300 元+'}
  ], {max:15500, ticks:[0,2500,5000,10000,15000], fmt:function(v){ return '¥' + fmtN(v); }, labelW:225, w:900});

  /* milestone 30/40/30 */
  (function(){
    function render(){
      var el = document.getElementById('fig-milestone'); if (!el) return;

      var segs = [
        {p:30, c:CH.gold, en:'On signing', zh:'签约时', dEn:'strategy + school list delivered', dZh:'交付策略与选校清单'},

      ['160','470','780'].forEach(function(cx){ s += '<path d="M' + cx + ' 76 L' + cx + ' 118" stroke="' + CH.axis + '" stroke-width="1.6" marker-end="none"/><path d="M' + (cx-5) + ' 112 L' + cx + ' 120 L' + (+cx+5) + ' 112" fill="none" stroke="' + CH.axis + '" stroke-width="1.6"/>'; });
      box(240, 122, 460, 56, CH.ink, CH.ink, '企业微信 · company-held 私域', '企业微信 · 公司持有的私域', 'channel-tagged QRs · drip SOPs · the client book stays when people leave', '渠道活码 · SOP 触达 · 人走客户留', CH.panel);

  /* budget stacked bars */

/* ===== slide framework ===== */
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0, N = slides.length;
  var dots = document.getElementById('dots');
  slides.forEach(function(_, i){
    var b = document.createElement('button');
    b.addEventListener('click', function(){ go(i); });
    dots.appendChild(b);
  });
  var dotBtns = dots.querySelectorAll('button');
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function go(i){
    if (i < 0 || i >= N) return;
    slides[cur].classList.remove('on');
    slides[cur].classList.toggle('back', i > cur);
    cur = i;
    slides.forEach(function(s, j){ s.classList.toggle('back', j < cur); });
    slides[cur].classList.add('on');
    document.getElementById('counter').textContent = pad(cur + 1) + ' / ' + pad(N);
    document.getElementById('progress').style.width = ((cur + 1) / N * 100) + '%';
    dotBtns.forEach(function(d, j){ d.classList.toggle('on', j === cur); });
    try { history.replaceState(null, '', '#s' + pad(cur + 1)); } catch(e){}
  }
  window.deckGo = go;
  document.getElementById('next').addEventListener('click', function(){ go(cur + 1); });
  document.getElementById('prev').addEventListener('click', function(){ go(cur - 1); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
  });
  var tx = null;
  document.addEventListener('touchstart', function(e){ tx = e.changedTouches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
    tx = null;
  }, {passive:true});
  var m = (location.hash || '').match(/^#s(\d+)$/);
  var start = m ? Math.min(N - 1, Math.max(0, parseInt(m[1], 10) - 1)) : 0;
  document.body.classList.toggle('zh', LANG === 'zh');
  document.querySelectorAll('#langbar button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === LANG); });
  buildCharts();
  go(start);
})();
</script>
