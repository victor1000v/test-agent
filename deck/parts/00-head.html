<title>AcademiaOne: The Next Moves</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Archivo:ital,wght@0,400..700;1,400..700&display=swap">
<style>
:root{
  --paper:#F5F0E4; --panel:#FBF8F1; --wash:#EFE8D3; --ink:#211C11; --ink-2:#5E5540; --ink-3:#8C8168;
  --line:#E3DAC4; --line-2:#CFC3A4; --gold:#A87B24; --gold-ink:#7A5A1B; --gold-soft:#C9A968;
  --oxblood:#8E2F1F; --oxblood-soft:#F3E2DC; --good:#3D6B1F;
  --s1:#2F63C1; --s2:#A87B24; --s3:#0B8A6E; --s4:#C74436; --s5:#8A4FA3;
  --serif:"Newsreader","Noto Serif SC",Georgia,"Songti SC",serif;
  --cjk:"Noto Serif SC","Newsreader",Georgia,"Songti SC",serif;
  --sans:"Archivo","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper); color:var(--ink); font-family:var(--serif); overflow:hidden; -webkit-font-smoothing:antialiased}
body.zh{font-family:var(--cjk)}
body.zh .en{display:none !important}
body:not(.zh) .zh{display:none !important}
::selection{background:var(--gold-soft)}

/* ---------- deck chrome ---------- */
.deck{position:fixed; inset:0}
.slide{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transform:translateX(28px); transition:opacity .45s ease, transform .45s ease;
  overflow:hidden;
}
.slide.on{opacity:1; pointer-events:auto; transform:none}
.slide.back{transform:translateX(-28px)}
.stage{width:min(1180px, 94vw); max-height:92vh; overflow-y:auto; padding:24px 8px; scrollbar-width:thin}

.chrome{position:fixed; z-index:50; font-family:var(--sans)}
#brand{top:22px; left:28px; font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase}
#brand em{color:var(--gold-ink); font-style:normal}
#brand .sub{display:block; font-size:9.5px; letter-spacing:.14em; color:var(--ink-3); margin-top:3px; font-weight:600}
#langbar{top:18px; right:24px; display:flex; border:1px solid var(--line-2); border-radius:99px; background:var(--panel); overflow:hidden; box-shadow:0 2px 10px rgba(33,28,17,.07)}
#langbar button{font-family:var(--sans); font-size:12px; letter-spacing:.06em; padding:7px 14px; background:transparent; color:var(--ink-2); border:0; cursor:pointer}
#langbar button.on{background:var(--ink); color:var(--paper)}
#counter{bottom:24px; left:28px; font-size:11.5px; letter-spacing:.12em; color:var(--ink-3); font-variant-numeric:tabular-nums}
#navbtns{bottom:18px; right:24px; display:flex; gap:8px}
#navbtns button{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line-2); background:var(--panel);
  color:var(--ink-2); font-size:15px; cursor:pointer; line-height:1;
}
#navbtns button:hover{background:var(--ink); color:var(--paper); border-color:var(--ink)}
#dots{bottom:31px; left:50%; transform:translateX(-50%); display:flex; gap:5px; max-width:52vw; flex-wrap:wrap; justify-content:center}
#dots button{width:7px; height:7px; border-radius:50%; border:0; background:var(--line-2); cursor:pointer; padding:0}
#dots button.on{background:var(--gold); transform:scale(1.35)}
#progress{top:0; left:0; height:3px; background:var(--gold); transition:width .45s ease; z-index:60}
.hint{bottom:24px; left:50%; transform:translateX(-50%); font-size:10.5px; color:var(--ink-3); letter-spacing:.1em; text-transform:uppercase; opacity:0; transition:opacity .5s}
body.hint-on .hint{opacity:1}

/* ---------- slide typography ---------- */
.eyebrow{font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:16px}
body.zh .eyebrow{font-family:var(--cjk); letter-spacing:.4em}
.eyebrow .n{color:var(--ink-3); margin-right:10px}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(44px,5.6vw,76px); line-height:1.04; letter-spacing:-.01em}
body.zh h1{font-family:var(--cjk); font-weight:500; line-height:1.2}
h2{font-family:var(--serif); font-weight:400; font-size:clamp(30px,3.4vw,46px); line-height:1.1; letter-spacing:-.005em; margin-bottom:14px; text-wrap:balance}
body.zh h2{font-family:var(--cjk); font-weight:500; line-height:1.3}
h3{font-family:var(--serif); font-weight:500; font-size:21px; line-height:1.3}
body.zh h3{font-family:var(--cjk)}
.dek{font-size:19px; line-height:1.55; color:var(--ink-2); max-width:62ch; margin-bottom:22px}
body.zh .dek{font-size:17px; line-height:1.8}
p{line-height:1.6}
.small{font-family:var(--sans); font-size:12.5px; color:var(--ink-2); line-height:1.55}
body.zh .small{font-family:var(--cjk)}
.num{font-variant-numeric:tabular-nums}
.foot{font-family:var(--sans); font-size:11px; color:var(--ink-3); margin-top:16px; line-height:1.5}
body.zh .foot{font-family:var(--cjk)}
.gold-rule{width:52px; height:3px; background:var(--gold); border:0; margin:20px 0}

/* ---------- components ---------- */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:12px}
@media(max-width:900px){.grid3,.grid4,.grid5{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:20px 22px}
.card.warn{background:var(--oxblood-soft); border-color:#D9B3A8}
.card.dark{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.card.dark .small{color:#B9AE93}
.card h4, h4.lbl{font-family:var(--sans); font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-ink); margin-bottom:9px}
body.zh .card h4, body.zh h4.lbl{font-family:var(--cjk); letter-spacing:.25em}
.card.warn h4{color:var(--oxblood)}
.card.dark h4{color:var(--gold-soft)}
.stat .v{font-family:var(--serif); font-size:clamp(42px,4.6vw,64px); line-height:1; letter-spacing:-.01em}
.stat .v small{font-size:.5em; color:var(--ink-2)}
.stat .k{font-family:var(--sans); font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-top:10px; line-height:1.5}
body.zh .stat .k{font-family:var(--cjk); letter-spacing:.18em}
.stat .s{font-family:var(--sans); font-size:12px; color:var(--ink-2); margin-top:6px; line-height:1.5}
body.zh .stat .s{font-family:var(--cjk)}
.chip{display:inline-block; font-family:var(--sans); font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:99px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--panel)}
body.zh .chip{font-family:var(--cjk)}
.chip.red{border-color:#D9B3A8; color:var(--oxblood); background:var(--oxblood-soft)}
.chip.gold{border-color:var(--gold-soft); color:var(--gold-ink); background:#F6EEDA}
.figbox{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:18px 20px 12px}
.figbox .ft{font-family:var(--sans); font-size:13px; font-weight:700; margin-bottom:2px}
body.zh .figbox .ft{font-family:var(--cjk)}
.figbox .fs{font-family:var(--sans); font-size:11px; color:var(--ink-3); margin-bottom:12px}
body.zh .figbox .fs{font-family:var(--cjk)}
.figbox svg{display:block; max-width:100%; height:auto}
table.dt{width:100%; border-collapse:collapse; font-family:var(--sans); font-size:13.5px}
body.zh table.dt{font-family:var(--cjk)}
table.dt th{text-align:left; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); border-bottom:2px solid var(--line-2); padding:7px 12px 7px 0}
table.dt td{border-bottom:1px solid var(--line); padding:9px 12px 9px 0; vertical-align:top; line-height:1.5}
table.dt tr:last-child td{border-bottom:none}
.check{display:flex; gap:12px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); font-size:16px; line-height:1.5}
.check:last-child{border-bottom:none}
.check .bx{flex:0 0 auto; width:20px; height:20px; border:2px solid var(--gold); border-radius:4px; margin-top:2px; position:relative}
.check .bx::after{content:''; position:absolute; inset:3px; background:var(--gold); border-radius:1px; opacity:.15}

#tip{position:fixed; z-index:99; pointer-events:none; display:none; max-width:300px; background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:12px; line-height:1.5; padding:8px 11px; border-radius:4px; box-shadow:0 6px 18px rgba(33,28,17,.3)}
#tip b{color:var(--gold-soft)}
#tip .en,#tip .zh{display:inline}

@media print{
  body{overflow:visible}
  .deck{position:static}
  .slide{position:static; opacity:1 !important; pointer-events:auto; transform:none; page-break-after:always; height:100vh}
  .chrome,#tip{display:none !important}
}
</style>
